async function editarPinAdmin(i, nuevoPin) {
  nuevoPin = (nuevoPin || '').trim();
  const admin = usersDB.admins[i];
  if (!admin) { toast('Administrador no encontrado.'); return; }
  if (!/^\d{3,8}$/.test(nuevoPin)) { toast('El PIN debe tener de 3 a 8 dígitos (solo números).'); return; }
  if (admin.pin === nuevoPin) { toast('El PIN no cambió.'); return; }
  // Choque con OTRO administrador
  const otroAdmin = usersDB.admins.find((u, j) => j !== i && u.pin === nuevoPin);
  if (otroAdmin) {
    toast('⚠ Ese PIN ya lo usa el administrador ' + otroAdmin.name + '. Elige otro.');
    renderUserManagement();
    return;
  }
  // Choque con usuarios de campo
  const choqueCampo = pinEnUso(nuevoPin, 'admins');
  if (choqueCampo) {
    toast('⚠ Ese PIN ya lo usa ' + choqueCampo.name + ' (' + roleLabel(choqueCampo.role) + '). Elige otro.');
    renderUserManagement();
    return;
  }
  admin.pin = nuevoPin;
  await saveUsers();
  await subirUsuariosADrive();   // sincroniza la nube de inmediato
  renderUserManagement();
  toast('✓ PIN actualizado para ' + admin.name);
}

async function editarPinUsuario(role, name, nuevoPin) {
  nuevoPin = (nuevoPin || '').trim();
  if (!ROLES_CAMPO.includes(role)) { toast('Rol no válido.'); return; }
  if (!/^\d{3,8}$/.test(nuevoPin)) { toast('El PIN debe tener de 3 a 8 dígitos (solo números).'); return; }
  const lista = usersDB[role] || [];
  const usuario = lista.find(u => u.name === name);
  if (!usuario) { toast('No se encontró el usuario.'); return; }
  if (usuario.pin === nuevoPin) { toast('El PIN no cambió.'); return; }
  // PIN único en todo el sistema, excluyendo al propio usuario
  const choque = pinEnUso(nuevoPin, role, name);
  if (choque) {
    toast('⚠ Ese PIN ya lo usa ' + choque.name + ' (' + roleLabel(choque.role) + '). Elige otro.');
    renderUserManagement();
    return;
  }
  usuario.pin = nuevoPin;
  await saveUsers();
  await subirUsuariosADrive();   // sincroniza la nube de inmediato
  renderUserManagement();
  toast('✓ PIN actualizado para ' + name);
}

async function addUser() {
  const role = document.getElementById('newUserRole').value;
  const name = document.getElementById('newUserName').value.trim();
  const pin = document.getElementById('newUserPin').value.trim();
  if (!ROLES_CAMPO.includes(role)) { toast('Elige un rol válido.'); return; }
  if (!name) { toast('Escribe el nombre.'); return; }
  if (!/^\d{3,8}$/.test(pin)) { toast('El PIN debe tener de 3 a 8 dígitos (solo números).'); return; }

  if (!usersDB[role]) usersDB[role] = [];
  // Nombre único dentro del mismo rol
  if (usersDB[role].some(u => u.name.toLowerCase() === name.toLowerCase())) {
    toast('Ya existe un usuario con ese nombre en ' + roleLabel(role) + '.');
    return;
  }
  // PIN único en TODO el sistema: evita choques de acceso entre usuarios
  const choque = pinEnUso(pin);
  if (choque) {
    toast('⚠ Ese PIN ya lo usa ' + choque.name + ' (' + roleLabel(choque.role) + '). Elige un PIN diferente.');
    return;
  }
  usersDB[role].push({ name, pin });
  await saveUsers();
  await subirUsuariosADrive();   // sincroniza la nube de inmediato
  document.getElementById('newUserName').value = '';
  document.getElementById('newUserPin').value = '';
  renderUserManagement();
  toast('✓ ' + roleLabel(role) + ' agregado: ' + name);
}

async function removeUser(role, name) {
  if (!confirm('¿Eliminar el acceso de ' + name + '?')) return;
  if (usersDB[role]) usersDB[role] = usersDB[role].filter(u => u.name !== name);
  await saveUsers();
  await subirUsuariosADrive();   // sincroniza la nube de inmediato
  renderUserManagement();
  toast('Acceso eliminado: ' + name);
}

// ============================================================
//   CÓDIGOS DE ACCESO CENTRALIZADOS EN DRIVE
//   Para que un PIN creado en un aparato sirva en TODOS, los usuarios/PINes
//   se guardan en un archivo central en Drive (__usuarios.json). Cada cambio
//   se manda de inmediato; cada aparato los lee al abrir la app y, por si acaso,
//   también cuando un ingreso falla (así un PIN recién creado entra al instante).
// ============================================================

// Sube TODOS los usuarios/PINes de este aparato al archivo central en Drive.
async function subirUsuariosADrive(opts) {
  opts = opts || {};
  if (!driveUrl) { if (opts.visible) toast('Drive no está configurado.'); return false; }
  try {
    await postToDrive(JSON.stringify({ guardarUsuarios: true, usuarios: usersDB }), { timeoutMs: 30000 });
    if (opts.visible) toast('☁️ Códigos guardados en la nube. Ya sirven en todos los aparatos.');
    return true;
  } catch (e) {
    if (opts.visible) toast('No se pudieron guardar los códigos. Revisa la conexión e inténtalo de nuevo.');
    return false;
  }
}

// Trae los usuarios/PINes centralizados desde Drive y los aplica en este aparato.
// Solo reemplaza lo local si la nube trae usuarios de campo (algo guardado de
// verdad), para nunca borrar lo local con una nube vacía.
async function descargarUsuariosDeDrive() {
  if (!driveUrl) return false;
  try {
    const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(driveUrl + sep + 'action=getUsers&_=' + Date.now(), { method: 'GET', redirect: 'follow', signal: controller.signal });
    clearTimeout(timer);
    const data = await res.json();
    const u = data && data.usuarios;
    const tieneCampo = u && ROLES_CAMPO.some(r => Array.isArray(u[r]) && u[r].length > 0);
    if (tieneCampo) {
      usersDB = migrarUsuarios(u);
      try { await window.storage.set('users', JSON.stringify(usersDB)); } catch (e) {}
      return true;
    }
    return false;
  } catch (e) {
    return false;
  }
}

// Botón del panel admin: guarda los códigos en la nube (forzado, con aviso).
async function guardarCodigosNube() {
  toast('☁️ Guardando códigos en la nube...');
  await subirUsuariosADrive({ visible: true });
}

// Botón del panel admin: trae los códigos más recientes desde la nube.
async function traerCodigosNube() {
  toast('🔄 Trayendo códigos de la nube...');
  const ok = await descargarUsuariosDeDrive();
  renderUserManagement();
  toast(ok ? '✓ Códigos actualizados desde la nube.' : 'La nube aún no tiene códigos guardados (o no hay conexión).');
}

// ============== RESPALDO Y SEGURIDAD ==============
// Exporta TODOS los certificados, usuarios y configuración a un archivo JSON.
// Es la red de seguridad maestra: con este archivo se puede restaurar todo.
async function exportarRespaldo() {
  try {
    const todas = await window.storage.list('');
    const keys = (todas && todas.keys) ? todas.keys : [];
    const data = {};
    for (const k of keys) {
      // No exportamos la sesión activa (es temporal)
      if (k === 'session') continue;
      try { const r = await window.storage.get(k); if (r) data[k] = r.value; } catch {}
    }
    const respaldo = {
      app: 'MarcAire',
      version: 6,
      exportadoPor: currentUser ? currentUser.name : '',
      fecha: new Date().toISOString(),
      datos: data
    };
    const blob = new Blob([JSON.stringify(respaldo, null, 2)], { type: 'application/json' });
    const fecha = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'respaldo-marcaire-' + fecha + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('✓ Respaldo exportado (' + keys.length + ' registros)');
  } catch (e) {
    toast('Error al exportar respaldo');
  }
}

async function importarRespaldo(event) {
  const file = (event.target.files || [])[0];
  if (!file) return;
  event.target.value = '';
  try {
    const texto = await file.text();
    const respaldo = JSON.parse(texto);
    if (!respaldo.datos) { toast('Archivo de respaldo no válido.'); return; }
    const numClaves = Object.keys(respaldo.datos).length;
    if (!confirm('¿Importar ' + numClaves + ' registros del respaldo del ' +
      (respaldo.fecha || '').slice(0, 10) + '?\n\nLos certificados existentes con el mismo número se conservan; se añaden los que falten.')) return;

    let importados = 0;
    for (const [k, v] of Object.entries(respaldo.datos)) {
      // No pisar lo que ya existe: solo agregamos lo que falta (anti-pérdida)
      const actual = await window.storage.get(k).catch(() => null);
      if (!actual) { await window.storage.set(k, v); importados++; }
      else if (k === 'users') {
        // Fusión anti-pérdida: actualiza PIN de los que ya están (por nombre)
        // y agrega los que falten. Así un respaldo SÍ trae usuarios nuevos/editados.
        try {
          const incoming = migrarUsuarios(JSON.parse(v));
          const merged = migrarUsuarios(JSON.parse(actual.value));
          ['admins', 'supervisor', 'tecnico', 'contratista'].forEach(rk => {
            (incoming[rk] || []).forEach(p => {
              const idx = merged[rk].findIndex(x => (x.name || '').toLowerCase().trim() === (p.name || '').toLowerCase().trim());
              if (idx >= 0) merged[rk][idx] = p; else merged[rk].push(p);
            });
          });
          await window.storage.set('users', JSON.stringify(merged));
          importados++;
        } catch (e) {}
      }
      else if (k === 'certCounter') {
        await window.storage.set(k, String(Math.max(parseInt(actual.value) || 0, parseInt(v) || 0)));
      }
    }
    // Recargar usuarios y contador por si cambiaron
    await loadUsers();
    const cc = await window.storage.get('certCounter');
    if (cc && cc.value && !pendingDirty) currentNumber = parseInt(cc.value);
    updateCertNumber();
    renderUserManagement();
    updatePendingBadge();
    toast('✓ Importados ' + importados + ' registros nuevos');
  } catch (e) {
    console.error(e);
    toast('No se pudo leer el respaldo (archivo dañado).');
  }
}

// Papelera: certificados eliminados quedan respaldados y se pueden recuperar
async function verPapelera() {
  try {
    const r = await window.storage.list('trash:');
    const keys = (r && r.keys) ? r.keys : [];
    if (keys.length === 0) { toast('La papelera está vacía.'); return; }
    const items = await Promise.all(keys.map(async k => {
      try { return { key: k, data: JSON.parse((await window.storage.get(k)).value) }; } catch { return null; }
    }));
    const validos = items.filter(Boolean);
    const content = document.getElementById('previewContent');
    content.innerHTML = `
      <div style="margin-bottom:10px; font-size:0.85rem; color:#64748b;">${validos.length} certificado(s) eliminado(s). Puedes recuperarlos:</div>
      ${validos.map(it => `
        <div class="user-row">
          <div>
            <div class="u-name">${it.data.numero}</div>
            <div class="u-role">${(it.data.cliente && it.data.cliente.nombre) || '(sin nombre)'} • ${it.data.fecha || ''}</div>
          </div>
          <button class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem;" onclick='recuperarCert(${JSON.stringify(it.data.numero)})'>Recuperar</button>
        </div>
      `).join('')}
    `;
    document.getElementById('previewModal').classList.add('show');
  } catch (e) {
    toast('Error al abrir la papelera');
  }
}

async function recuperarCert(numero) {
  try {
    const r = await window.storage.get('trash:' + numero);
    if (!r) return;
    await window.storage.set('cert:' + numero, r.value);
    await window.storage.delete('trash:' + numero);
    toast('✓ Certificado ' + numero + ' recuperado');
    closeModal('previewModal');
  } catch (e) {
    toast('Error al recuperar');
  }
}

// (La antigua función saveSettings se eliminó: la configuración de Drive y
// contador ahora se maneja directamente en el código; los PINes se guardan con
// saveAdminPins y los usuarios con addUser/removeUser.)


function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Cerrar modales al hacer clic en el fondo
document.querySelectorAll('.modal-bg').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

init();
</script>


<script>
(function(){
  function actualizarProx(){
    var p=document.getElementById('proximoMant'), f=document.getElementById('fecha');
    if(!p||!f) return;
    if(p.dataset.touched==='1') return;
    if(typeof mesesDespues==='function') p.value = mesesDespues(f.value, 4);
  }
  function init(){
    var p=document.getElementById('proximoMant'), f=document.getElementById('fecha');
    if(p) p.addEventListener('input', function(){ p.dataset.touched='1'; });
    if(f) f.addEventListener('change', actualizarProx);
    actualizarProx();
  }
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded', init);
})();
</script>

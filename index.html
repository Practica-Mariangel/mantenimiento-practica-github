<!DOCTYPE html>

<title>Certificado de Arranque - Servicio Técnico</title>

<style>
  body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .sig-canvas { touch-action: none; background: #fff; border: 2px dashed #94a3b8; border-radius: 8px; width: 100%; height: 160px; display: block; }
  .sig-canvas.filled { border-style: solid; border-color: #0284c7; }
  .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; user-select: none; }

  .check-item input { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; accent-color: #0284c7; }
  .check-item span { font-size: 0.92rem; color: #1e293b; line-height: 1.35; }
  input[type="text"], input[type="date"], input[type="number"], textarea, select {
    width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 9px;

  }
  select {

  body.bg-slate-100 { background: #eef2f7; }
  .section-card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 6px 18px rgba(15,23,42,0.05); border: 1px solid #e8eef4; }

  .field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* === Logo principal: tratamiento elegante sobre blanco === */

  .help-text { font-size: 0.78rem; color: #64748b; line-height: 1.45; margin-top: 4px; }

  /* === GPS button === */
  .gps-btn { font-size: 0.78rem; padding: 5px 10px; border-radius: 6px; background: #0c4a6e; color: white; border: none; font-weight: 600; cursor: pointer; }

  .gps-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .gps-info { margin-top: 6px; padding: 8px 10px; background: #ecfeff; border-left: 3px solid #06b6d4; border-radius: 4px; font-size: 0.78rem; color: #155e75; line-height: 1.4; }

  .gps-info.ok { background: #f0fdf4; border-left-color: #16a34a; color: #166534; }
  .gps-info.warn { background: #fef9c3; border-left-color: #ca8a04; color: #854d0e; }
  .gps-info.err { background: #fef2f2; border-left-color: #dc2626; color: #991b1b; }
  .gps-btn-exit { font-size: 0.9rem; padding: 12px 14px; border-radius: 8px; background: #1e40af; color: white; border: none; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(30,64,175,0.2); }
  .gps-btn-exit:active { transform: scale(0.98); }
  .gps-btn-exit.validated { background: #16a34a; box-shadow: 0 2px 4px rgba(22,163,74,0.25); }
  .gps-btn-exit.processing { background: #ca8a04; }
  .gps-btn-exit:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
  .gps-btn-entry { font-size: 0.9rem; padding: 12px 14px; border-radius: 8px; background: #0369a1; color: white; border: none; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(3,105,161,0.2); }
  .gps-btn-entry:active { transform: scale(0.98); }
  .gps-btn-entry.validated { background: #16a34a; box-shadow: 0 2px 4px rgba(22,163,74,0.25); }
  .gps-btn-entry.processing { background: #ca8a04; }
  .gps-btn-entry:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
  /* Display de ubicación debajo de cada hora */
  .gps-display { margin-top: 6px; padding: 8px 10px; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px; font-size: 0.78rem; line-height: 1.4; color: #0c4a6e; }
  .gps-display.ok { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .gps-display.warn { background: #fef9c3; border-color: #fde047; color: #854d0e; }
  .gps-display .place { display: flex; align-items: flex-start; gap: 6px; }
  .gps-display .place-name { font-weight: 600; word-break: break-word; flex: 1; }
  .gps-display .maps-link { display: inline-block; margin-top: 4px; color: #0369a1; text-decoration: underline; font-weight: 600; }
  .gps-display.ok .maps-link { color: #15803d; }
  .gps-display .coords { font-size: 0.7rem; color: #64748b; margin-top: 2px; font-family: 'Courier New', monospace; }
  /* === Photo grid === */

  .photo-remove:active { transform: scale(0.9); }

  /* === Pantalla de acceso (login) === */
  #loginScreen { position: fixed; inset: 0; z-index: 2000; background: linear-gradient(160deg, #0c4a6e 0%, #075985 55%, #0284c7 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: #fff; border-radius: 18px; width: 100%; max-width: 380px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

  .role-btn:active { transform: scale(0.97); }
  .role-btn.selected { border-color: #0284c7; background: #e0f2fe; }

  .login-field { margin-bottom: 14px; }

  .login-field select, .login-field input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
  .pin-input { letter-spacing: 0.5em; text-align: center; font-size: 1.4rem !important; font-weight: 700; }
  .login-error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 12px; display: none; }
  .login-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #0284c7; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .login-btn:active { background: #0369a1; }
  .current-user { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; padding: 3px 9px; border-radius: 12px; background: rgba(255,255,255,0.22); color: #fff; font-weight: 600; }

<div id="appMount"></div>
<script>
/* ===== PATRÓN CH9 (regla MARC 23-jul-2026) =====
   La interfaz NO viaja escrita en el HTML: se construye desde JS al abrir la app.
   Motivo: el escáner anti-phishing de Cloudflare Pages marca la combinación
   logo + campo de PIN + botón Entrar, y bloquea la subida sin avisar el motivo.

const APP_MARKUP = "\n\n<!-- ===== PANTALLA DE ACCESO ===== -->\n<div id=\"loginScreen\">\n  <div class=\"login-card\">\n    <img id=\"loginLogo\" class=\"login-logo\" alt=\"Grupo MARC\">\n    <div class=\"login-title\">Certificados MARCAire</div>\n    <div class=\"login-sub\">Departamento Servicio T\u00e9cnico</div>\n    <!-- Sello de versi\u00f3n: permite confirmar de un vistazo que el despliegue entr\u00f3.\n         Si despu\u00e9s de subir a Pages este n\u00famero NO cambia, el navegador tiene la\n         versi\u00f3n vieja en memoria (Ctrl+Shift+R) o el archivo no se public\u00f3. -->\n    <div style=\"text-align:center; font-size:0.68rem; color:#94a3b8; margin-top:4px; letter-spacing:0.04em;\">v142 \u00b7 12 oct 2026</div>\n\n    <div class=\"login-error\" id=\"loginError\"></div>\n\n    <div class=\"role-grid\">\n      <button type=\"button\" class=\"role-btn\" data-role=\"admin\" onclick=\"selectRole('admin')\">\n        <span class=\"role-icon\">\ud83d\udd11</span>\n        <span class=\"role-name\">Administrador</span>\n      </button>\n      <button type=\"button\" class=\"role-btn\" data-role=\"supervisor\" onclick=\"selectRole('supervisor')\">\n        <span class=\"role-icon\">\ud83d\udc77</span>\n        <span class=\"role-name\">Supervisor</span>\n      </button>\n      <button type=\"button\" class=\"role-btn\" data-role=\"tecnico\" onclick=\"selectRole('tecnico')\">\n        <span class=\"role-icon\">\ud83d\udee0\ufe0f</span>\n        <span class=\"role-name\">T\u00e9cnico</span>\n      </button>\n      <button type=\"button\" class=\"role-btn\" data-role=\"contratista\" onclick=\"selectRole('contratista')\">\n        <span class=\"role-icon\">\ud83e\uddf0</span>\n        <span class=\"role-name\">Contratista</span>\n      </button>\n    </div>\n\n    <!-- Selector de usuario (solo para subcontratistas con varios registrados) -->\n    <div class=\"login-field\" id=\"userSelectWrap\" style=\"display:none;\">\n      <label>Selecciona tu nombre</lab // ===============================================================
// AGRUPACIÓN Y CONSOLIDACIÓN DE CLIENTES CON "CCI"
// ===============================================================
// Detecta cualquier nombre que contenga la palabra clave "CCI"
// (insensible a mayúsculas, espacios extra y presencia/ausencia de "TORRE")
// y consolida todo en una sola fila principal llamada "CCI"
// manteniendo los nombres detallados como sublista "variantes"
// ===============================================================

function normalizeClienteNameForCCI(value) {
  if (value === null || value === undefined) {
    return { isCCI: false, normalized: "" };
  }

  const text = String(value)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .replace(/\s+/g, " ")
    .trim();

  const normalized = text.replace(/\bTORRE\b/g, "").replace(/\s+/g, " ").trim();

  const isCCI = /\bCCI\b/.test(normalized);

  return {
    isCCI,
    normalized
  };
}

function agruparClientesCCI(clientes) {
  const grupos = new Map();

  function ensureGroup(key, nombrePrincipal) {
    if (!grupos.has(key)) {
      grupos.set(key, {
        nombre: nombrePrincipal,
        totalVisitas: 0,
        totalInformes: 0,
        variantes: []
      });
    }
    return grupos.get(key);
  }

  for (const item of clientes || []) {
    const nombreOriginal = item?.nombre ?? item?.cliente ?? item?.name ?? "";
    const visitas = Number(item?.visitas ?? item?.totalVisitas ?? item?.visits ?? 0);
    const informes = Number(
      item?.informes ??
      item?.totalInformes ??
      item?.reportes ??
      item?.reports ??
      0
    );

    const { isCCI } = normalizeClienteNameForCCI(nombreOriginal);
    const nombreFinal = isCCI ? "CCI" : String(nombreOriginal || "").trim();

    const grupo = ensureGroup(nombreFinal, nombreFinal);

    grupo.totalVisitas += visitas;
    grupo.totalInformes += informes;

    const variantName = String(nombreOriginal || "").trim();

    const varianteExistente = grupo.variantes.find(v => v.nombre === variantName);

    if (varianteExistente) {
      varianteExistente.visitas += visitas;
      varianteExistente.informes += informes;
    } else {
      grupo.variantes.push({
        nombre: variantName,
        visitas,
        informes
      });
    }
  }

  return Array.from(grupos.values()).sort((a, b) => {
    if (a.nombre === "CCI" && b.nombre !== "CCI") return -1;
    if (a.nombre !== "CCI" && b.nombre === "CCI") return 1;
    if (b.totalInformes !== a.totalInformes) return b.totalInformes - a.totalInformes;
    return a.nombre.localeCompare(b.nombre, "es");
  });
}

function renderDetallePorCliente(clientes) {
  return agruparClientesCCI(clientes);
}

// ============== STORAGE SHIM (localStorage en cualquier navegador) ==============
// Reemplaza window.storage con un wrapper sobre localStorage. La app fue diseñada
// para Claude.ai donde existe window.storage, pero al estar hospedada en Netlify
// usamos localStorage del navegador (que persiste entre sesiones).
if (!window.storage || typeof window.storage.get !== 'function') {
  window.storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(key);
        if (v === null) return null;
        return { key, value: v, shared: false };
      } catch (e) { return null; }
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(key, String(value));
        return { key, value: String(value), shared: !!shared };
      } catch (e) { return null; }
    },
    async delete(key) {
      try {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      } catch (e) { return null; }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
        }
        return { keys, prefix: prefix || '', shared: false };
      } catch (e) { return { keys: [], prefix: prefix || '', shared: false }; }
    }
  };
}

function nuevaBaseUsuarios() {
  return { admins: [...ADMIN_DEFAULTS], supervisor: [], tecnico: [], contratista: [] };
}

// Migra estructuras viejas (marc/sub) a las nuevas sin perder usuarios.
function migrarUsuarios(db) {
  db = db || {};
  if (!db.admins || db.admins.length === 0) db.admins = [...ADMIN_DEFAULTS];
  ROLES_CAMPO.forEach(rk => { if (!Array.isArray(db[rk])) db[rk] = []; });
  if (Array.isArray(db.marc)) {  // 'marc' (Supervisor MARC) -> supervisor
    db.marc.forEach(u => { if (!db.supervisor.some(x => x.name === u.name)) db.supervisor.push(u); });
    delete db.marc;
  }
  if (Array.isArray(db.sub)) {   // 'sub' (Subcontratista) -> contratista
    db.sub.forEach(u => { if (!db.contratista.some(x => x.name === u.name)) db.contratista.push(u); });
    delete db.sub;
  }
  return db;
}

async function loadUsers() {
  try {
    const r = await window.storage.get('users');
    if (r && r.value) {
      usersDB = migrarUsuarios(JSON.parse(r.value));
      await saveUsers();   // persiste la migración
    } else {
      usersDB = nuevaBaseUsuarios();
      await saveUsers();
    }
  } catch (e) {
    usersDB = nuevaBaseUsuarios();
  }
}

}

// Devuelve {role,name} si el PIN ya lo usa otro usuario, o null si está libre.
// skipGroup/skipName permiten excluir al propio usuario que se está editando.
function pinEnUso(pin, skipGroup, skipName) {
  for (const g of ['admins', ...ROLES_CAMPO]) {
    for (const u of (usersDB[g] || [])) {
      const esElMismo = (g === skipGroup) && (skipName === undefined || u.name === skipName);
      if (u.pin === pin && !esElMismo) {
        return { role: (g === 'admins' ? 'admin' : g), name: u.name };
      }
    }
  }
  return null;
}

async function doLogin() {
  const pin = document.getElementById('pinInput').value.trim();
  if (!selectedRole) { loginError('Selecciona tu tipo de acceso.'); return; }
  if (!pin) { loginError('Ingresa tu PIN.'); return; }

  let lista, nombreElegido = null;
  if (selectedRole === 'admin') lista = usersDB.admins;
  else lista = usersDB[selectedRole] || [];

  // Si hay selector de nombre visible, validar ese usuario específico
  const wrap = document.getElementById('userSelectWrap');
  if (wrap.style.display !== 'none') nombreElegido = document.getElementById('userSelect').value;

  function buscarMatch() {
    if (wrap.style.display !== 'none' && nombreElegido) {
      return lista.find(u => u.name === nombreElegido && u.pin === pin);
    }
    return lista.find(u => u.pin === pin);
  }

  let match = lista.length ? buscarMatch() : null;

  // Si el PIN no aparece en este aparato (o no hay usuarios de este tipo todavía),
  // puede ser un código recién creado en otro teléfono. Consultamos la nube una
  // vez y reintentamos antes de rechazar.
  if (!match && driveUrl) {
    loginError('Buscando tu código…');
    const actualizo = await descargarUsuariosDeDrive();
    document.getElementById('loginError').style.display = 'none';
    if (actualizo) {
      lista = (selectedRole === 'admin') ? usersDB.admins : (usersDB[selectedRole] || []);
      match = lista.length ? buscarMatch() : null;
    }
  }

  if (!match) {
    if (!lista.length) { loginError('No hay usuarios de este tipo. Pide a un administrador que te registre.'); return; }
    loginError('PIN incorrecto. Inténtalo de nuevo.'); return;
  }

  currentUser = { role: selectedRole, name: match.name };
  document.getElementById('pinInput').value = '';

  if (selectedRole === 'admin') {
    // Los administradores NO entran a la app ni se guarda su sesión:
    // van directo a su panel y siempre vuelven a la pantalla de inicio.
    // FIX: limpiamos cualquier sesión previa (de un técnico/supervisor) para que
    // al refrescar la app NO reviva a otro usuario (ej. Walter).
    try { await window.storage.delete('session'); } catch (e) {}
    renderUserManagement();
    document.getElementById('adminModal').classList.add('show');
  } else {
    // Técnicos / supervisores: entran a la app. Por seguridad la sesión NO se
    // guarda; la app volverá a pedir el PIN en el próximo refresco o apertura.
    enterApp();
  }
}

// Sube a Drive (en segundo plano, una sola vez por certificado) los datos
// completos guardados en este dispositivo, para que cualquier cliente quede
// disponible para auto-llenar desde cualquier dispositivo. No sube fotos.
async function migrarDatosParaAutollenado(opts) {
  opts = opts || {};
  const visible = !!opts.visible;
  if (!driveUrl) { if (visible) toast('Drive no está configurado.'); return { enviados: 0, total: 0 }; }
  // En modo silencioso, no competir con subidas reales ni con una cola pendiente.
  if (!visible) {
    if (window._subiendoDrive) return { enviados: 0, total: 0 };
    try { const pend = await window.storage.list('pending:'); if (pend && pend.keys && pend.keys.length) return { enviados: 0, total: 0 }; } catch (e) {}
  }
  if (visible) toast('📤 Preparando datos para auto-llenado...');
  let done = [];
  try { const r = await window.storage.get('bfDone'); if (r && r.value) done = JSON.parse(r.value); } catch (e) {}
  const doneSet = new Set(done);
  let lista;
  try { lista = await window.storage.list('cert:'); } catch (e) { return { enviados: 0, total: 0 }; }
  const keys = (lista && lista.keys) ? lista.keys : [];
  const tope = visible ? 999 : 6; // el botón procesa todo; en silencio, tandas pequeñas y suaves
  let enviados = 0, candidatos = 0;
  for (const k of keys) {
    if (enviados >= tope) break;
    if (!visible && window._subiendoDrive) break; // una subida real tiene prioridad
    let c;
    try { c = JSON.parse((await window.storage.get(k)).value); } catch (e) { continue; }
    if (!c || !c.cliente || !c.cliente.nombre) continue;
    if (c.fromDrive) continue;                                   // los de Drive no traen datos completos
    if (!c.operacion && !(c.equipos && c.equipos.length)) continue; // solo certificados con datos
    if (!c.numero) continue;
    candidatos++;
    if (doneSet.has(c.numero)) continue;
    const slim = { ...c, fotos: [] };
    if (slim.firmas) slim.firmas = { tecnico: slim.firmas.tecnico || '', ayudante: slim.firmas.ayudante || '', cliente: slim.firmas.cliente || '' };
    try {
      await postToDrive(JSON.stringify({ soloDatos: true, certData: slim }), { timeoutMs: 30000 });
      doneSet.add(c.numero);
      enviados++;
      if (!visible) await new Promise(r => setTimeout(r, 900)); // respirar entre envíos
    } catch (e) { /* se reintenta luego */ }
  }
  if (enviados > 0) {
    try { await window.storage.set('bfDone', JSON.stringify([...doneSet])); } catch (e) {}
  }
  if (visible) {
    if (candidatos === 0) {
      toast('Este equipo no tiene certificados con datos completos guardados aquí. (Los datos viven en el equipo donde se crearon).');
    } else if (enviados === 0) {
      toast('✓ Los ' + candidatos + ' certificados de este equipo ya estaban preparados.');
    } else {
      toast('✓ Preparados ' + enviados + ' certificado(s) para auto-llenado.');
    }
  }
  return { enviados, total: candidatos };
}

// ====== LISTA DESPLEGABLE DE CLIENTES (autocompletar) ======
// Llena el desplegable del campo "Nombre del cliente" con los nombres de las
// carpetas de clientes en Drive + los clientes de certificados locales. Se
// actualiza sola: cada vez que entra a la app y cada vez que se guarda uno nuevo.
// v142 — NORMALIZADOR DE NOMBRES DE CLIENTE ("carpeta" del cliente)
// MAYÚSCULAS + sin espacios al inicio/final + espacios internos colapsados.
// Así "torre  c " y "TORRE C" son el MISMO cliente y nunca se duplica.
// (El Worker v154 aplica exactamente la misma regla del lado del servidor.)
function normalizarNombre(s) {
  return String(s == null ? '' : s)
    .normalize('NFC')
    .replace(/[\s\u200B]+/g, ' ')
    .trim()
    .toLocaleUpperCase('es');
}
let _clientesConocidos = new Set();   // claves normalizadas de clientes que ya existen

function pintarListaClientes(set) {
  const dl = document.getElementById('listaClientes');
  if (!dl) return;
  // Deduplica por nombre normalizado: "Torre C" y "TORRE C" salen una sola vez.
  const unicos = new Set();
  [...set].forEach(n => { const k = normalizarNombre(n); if (k && k !== 'SIN CLIENTE') unicos.add(k); });
  _clientesConocidos = unicos;
  const arr = [...unicos].sort((a, b) => a.localeCompare(b, 'es'));
  dl.innerHTML = arr.map(n => '<option value="' + String(n).replace(/"/g, '&quot;') + '"></option>').join('');
}

// Al salir del campo "Nombre del cliente": se normaliza lo escrito y, si
// coincide con un cliente existente, se avisa que se usará el mismo.
document.addEventListener('focusout', (e) => {
  const el = e.target;
  if (!el || el.id !== 'nombreCliente') return;
  const antes = el.value;
  const ahora = normalizarNombre(antes);
  if (ahora === antes) return;
  el.value = ahora;
  if (ahora && _clientesConocidos.has(ahora)) {
    try { toast('✓ Cliente existente: ' + ahora + ' — se usará el mismo registro'); } catch (err) {}
  }
});

async function cargarListaClientes() {
  const set = new Set();
  // 1) Cache guardada (aparece al instante, aun sin internet)
  try {
    const r = await window.storage.get('clientesCache');
    if (r && r.value) JSON.parse(r.value).forEach(n => set.add(n));
  } catch (e) {}
  // 2) Clientes de certificados locales
  try {
    const lista = await window.storage.list('cert:');
    for (const k of ((lista && lista.keys) || [])) {
      try {
        const c = JSON.parse((await window.storage.get(k)).value);
        const n = (c && c.cliente && c.cliente.nombre || '').trim();
        if (n && n !== 'Sin cliente') set.add(n);
      } catch (e) {}
    }
  } catch (e) {}
  pintarListaClientes(set);
  // 3) Clientes en Drive (todas las carpetas) — fresco
  if (driveUrl) {
    try {
      const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      const res = await fetch(driveUrl + sep + 'action=list', { method: 'GET', redirect: 'follow', signal: controller.signal });
      clearTimeout(timer);
      const data = await res.json();
      if (data && Array.isArray(data.certs)) {
        data.certs.forEach(c => {
          const n = (c.cliente || '').trim();
          if (n && n !== 'Sin cliente') set.add(n);
        });
        pintarListaClientes(set);
        try { await window.storage.set('clientesCache', JSON.stringify([...set])); } catch (e) {}
      }
    } catch (e) {}
  }
}

// Los logos ahora viven como archivos en img/ (HTML más liviano, regla MARC 23-jul-2026).
// El PDF los necesita incrustados, así que se precargan a dataURL en segundo plano.
// buildPDF espera esta promesa, de modo que el certificado nunca sale sin logo.
let LOGOS_PDF_LISTOS = Promise.resolve();
function precargarLogosPDF() {
  LOGOS_PDF_LISTOS = Promise.all(['marcaire', 'grupo'].map(async k => {
    try {
      const ruta = LOGOS[k];
      if (!ruta || String(ruta).indexOf('data:') === 0) return;
      const r = await fetch(ruta);
      const b = await r.blob();
      LOGOS[k] = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(b);
      });
    } catch (e) { /* si falla, el PDF se genera igual (addImage va en try/catch) */ }
  }));
  return LOGOS_PDF_LISTOS;
}

async function syncCounterFromDrive(actualizarPantalla) {
  if (!driveUrl) return;
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    const res = await fetch(driveUrl, { method: 'GET', redirect: 'follow', signal: controller.signal });
    clearTimeout(timer);
    const data = await res.json();
    if (data && data.nextNumber) {
      // El servidor es la ÚNICA fuente de verdad del consecutivo (reserva atómica).
      // Confiamos en su número y NO lo maximizamos con el valor local (que podía
      // quedar inflado y "pegar" un número equivocado como 1000).
      const siguiente = parseInt(data.nextNumber, 10) || 0;
      if (siguiente > 0) {
        await window.storage.set('certCounter', String(siguiente));
        if (actualizarPantalla) {
          currentNumber = siguiente;
          updateCertNumber();
        }
      }
    }
  } catch (e) {
    console.log('No se pudo sincronizar contador con Drive:', e);
  }
}

// ============== FIRMA EN CANVAS ==============
function initSignature(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';
  }
  resize();
  window.addEventListener('resize', () => { resize(); });

  let drawing = false;
  let last = null;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = getPos(e);
    canvas.classList.add('filled');
    signatures[canvasId] = true;
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last = pos;
  }
  function end(e) {
    if (drawing) e.preventDefault();
    drawing = false;
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end, { passive: false });
}

function clearSig(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.classList.remove('filled');
  signatures[canvasId] = false;
}

// ============== GPS ENTRADA ==============
function getLocation() {
  const btn = document.getElementById('gpsBtn');
  const btnText = document.getElementById('gpsBtnText');
  const display = document.getElementById('gpsEntradaDisplay');

  btn.classList.add('processing');
  btn.classList.remove('validated');
  btnText.textContent = '⏳ Obteniendo ubicación...';

  try {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      display.style.display = 'block';
      display.className = 'gps-display warn';
      display.innerHTML = '❌ La ubicación solo funciona en sitios HTTPS.';
      btn.classList.remove('processing');
      btnText.textContent = '📍 Marcar ubicación de entrada';
      return;
    }
    if (!navigator.geolocation) {
      display.style.display = 'block';
      display.className = 'gps-display warn';
      display.innerHTML = '❌ Tu navegador no soporta geolocalización.';
      btn.classList.remove('processing');
      btnText.textContent = '📍 Marcar ubicación de entrada';
      return;
    }

    btn.disabled = true;

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const lat = parseFloat(pos.coords.latitude.toFixed(6));
          const lng = parseFloat(pos.coords.longitude.toFixed(6));
          const acc = Math.round(pos.coords.accuracy);
          gpsCoords = { lat, lng, accuracy: acc, placeName: null };
          btn.disabled = false;
          btn.classList.remove('processing');
          btn.classList.add('validated');
          btnText.textContent = '✓ Entrada registrada — Actualizar';
          pendingDirty = true;

          // Mostrar display inmediato (sin nombre todavía)
          renderGpsDisplay('gpsEntradaDisplay', gpsCoords, 'entrada');

          // Reverse geocoding en background
          const placeName = await reverseGeocode(lat, lng);
          if (placeName) {
            gpsCoords.placeName = placeName;
            renderGpsDisplay('gpsEntradaDisplay', gpsCoords, 'entrada');
          }
        } catch (e) {
          display.style.display = 'block';
          display.className = 'gps-display warn';
          display.innerHTML = '❌ Error procesando coordenadas: ' + e.message;
          btn.disabled = false;
          btn.classList.remove('processing');
          btnText.textContent = '📍 Reintentar';
        }
      },
      (err) => {
        let msg = '❌ ';
        if (err.code === 1) msg += 'Permiso denegado. En iPhone: Ajustes → Safari → Ubicación → Permitir.';
        else if (err.code === 2) msg += 'Señal GPS no disponible. Probá afuera o cerca de una ventana.';
        else if (err.code === 3) msg += 'Tardó demasiado. Tocá el botón de nuevo.';
        else msg += 'Error: ' + (err.message || 'desconocido');
        display.style.display = 'block';
        display.className = 'gps-display warn';
        display.innerHTML = msg;
        btn.disabled = false;
        btn.classList.remove('processing');
        btnText.textContent = '📍 Reintentar entrada';
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
    );
  } catch (e) {
    display.style.display = 'block';
    display.className = 'gps-display warn';
    display.innerHTML = '❌ Error inesperado: ' + (e.message || e);
    btn.disabled = false;
    btn.classList.remove('processing');
    btnText.textContent = '📍 Reintentar entrada';
  }
}

// ============== GPS SALIDA + VALIDACIÓN DE DISTANCIA ==============
// Fórmula de Haversine: calcula distancia en metros entre dos puntos GPS
function calcularDistanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000; // Radio de la Tierra en metros
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Reverse geocoding: convierte coordenadas a nombre del lugar legible (usa BigDataCloud, gratis sin API key)
async function reverseGeocode(lat, lng) {
  try {
    const url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lng + '&localityLanguage=es';
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const parts = [
      data.locality,
      data.city,
      data.principalSubdivision,
      data.countryName
    ].filter(Boolean);
    // Remover duplicados (a veces locality == city)
    const unique = [...new Set(parts)];
    return unique.length ? unique.join(', ') : null;
  } catch (e) {
    return null;
  }
}

// Renderiza la cajita de info de GPS debajo de cada hora
function renderGpsDisplay(elementId, gps, tipo) {
  const el = document.getElementById(elementId);
  if (!gps || !gps.lat) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const mapsUrl = 'https://www.google.com/maps?q=' + gps.lat + ',' + gps.lng;
  const nombre = gps.placeName || 'Ubicación sin nombre identificado';

  let claseExtra = '';
  let etiqueta = tipo === 'entrada' ? '📍 Lugar de entrada' : '📍 Lugar de salida';
  if (tipo === 'salida' && gps.distancia !== null && gps.distancia !== undefined) {
    if (gps.distancia <= 200) claseExtra = ' ok';
    etiqueta += ' (' + gps.distancia + ' m del sitio)';
  } else if (tipo === 'salida' && (gps.distancia === null || gps.distancia === undefined)) {
    claseExtra = ' warn';
    etiqueta += ' (sin verificación)';
  }

  el.className = 'gps-display' + claseExtra;
  el.style.display = 'block';
  el.innerHTML =
    '<div class="place"><span class="place-name">' + etiqueta + '</span></div>' +
    '<div style="margin-top:3px;">' + nombre + '</div>' +
    '<div class="coords">' + gps.lat.toFixed(6) + ', ' + gps.lng.toFixed(6) + ' (±' + gps.accuracy + 'm)</div>' +
    '<a href="' + mapsUrl + '" target="_blank" rel="noopener" class="maps-link">Ver en Google Maps →</a>';
}

function habilitarHoraCierre(autocompletar) {

  if (autocompletar && !horaCierre.value) {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    horaCierre.value = hh + ':' + mm;
  }
}

function getLocationExit() {
  const btn = document.getElementById('gpsExitBtn');
  const btnText = document.getElementById('gpsExitBtnText');
  const info = document.getElementById('gpsExitInfo');

  info.style.display = 'block';
  info.className = 'gps-info mt-2';
  info.innerHTML = '⏳ Procesando ubicación de salida...';
  btn.classList.add('processing');
  btn.classList.remove('validated');
  btnText.textContent = '⏳ Obteniendo GPS de salida...';

  try {
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      info.className = 'gps-info mt-2 err';
      info.innerHTML = '❌ La ubicación solo funciona en sitios HTTPS.';
      btn.classList.remove('processing');
      btnText.textContent = '📍 Marcar ubicación de salida';
      return;
    }
    if (!navigator.geolocation) {
      info.className = 'gps-info mt-2 err';
      info.innerHTML = '❌ Tu navegador no soporta geolocalización.';
      btn.classList.remove('processing');
      btnText.textContent = '📍 Marcar ubicación de salida';
      return;
    }

    btn.disabled = true;

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const lat = parseFloat(pos.coords.latitude.toFixed(6));
          const lng = parseFloat(pos.coords.longitude.toFixed(6));
          const acc = Math.round(pos.coords.accuracy);

          btn.disabled = false;
          btn.classList.remove('processing');

          // ¿Hay GPS de entrada para comparar?
          if (gpsCoords && gpsCoords.lat) {
            const dist = Math.round(calcularDistanciaMetros(gpsCoords.lat, gpsCoords.lng, lat, lng));
            gpsCoordsSalida = { lat, lng, accuracy: acc, distancia: dist, placeName: null };

            if (dist <= 200) {
              info.className = 'gps-info mt-2 ok';
              info.innerHTML = '✅ <strong>Ubicación validada</strong> — estás a ' + dist + ' m del sitio. Hora de cierre habilitada.';
              btn.classList.add('validated');
              btnText.textContent = '✓ Ubicación de salida validada';
              habilitarHoraCierre(true);
              pendingDirty = true;
              renderGpsDisplay('gpsSalidaDisplay', gpsCoordsSalida, 'salida');
            } else {
              info.className = 'gps-info mt-2 err';
              info.innerHTML = '❌ <strong>Estás a ' + dist + ' m del sitio</strong> — debes estar dentro de 200 m. Acércate al sitio y volvé a marcar.';
              btnText.textContent = '📍 Reintentar marcar salida';
              // Aun así mostrar el display (en rojo no, pero mostrar dónde está)
              renderGpsDisplay('gpsSalidaDisplay', gpsCoordsSalida, 'salida');
            }
          } else {
            gpsCoordsSalida = { lat, lng, accuracy: acc, distancia: null, placeName: null };
            info.className = 'gps-info mt-2 warn';
            info.innerHTML = '⚠️ <strong>No se registró GPS de entrada</strong> — la salida queda registrada sin verificación. Hora de cierre habilitada.';
            btn.classList.add('validated');
            btnText.textContent = '✓ Ubicación de salida registrada';
            habilitarHoraCierre(true);
            pendingDirty = true;
            renderGpsDisplay('gpsSalidaDisplay', gpsCoordsSalida, 'salida');
          }

          // Reverse geocoding en background (no bloquea)
          const placeName = await reverseGeocode(lat, lng);
          if (placeName && gpsCoordsSalida) {
            gpsCoordsSalida.placeName = placeName;
            renderGpsDisplay('gpsSalidaDisplay', gpsCoordsSalida, 'salida');
          }
        } catch (e) {
          info.className = 'gps-info mt-2 err';
          info.innerHTML = '❌ Error procesando coordenadas: ' + e.message;
          btn.disabled = false;
          btn.classList.remove('processing');
          btnText.textContent = '📍 Reintentar marcar salida';
        }
      },
      (err) => {
        let msg = '❌ ';
        if (err.code === 1) msg += 'Permiso denegado. En iPhone: Ajustes → Safari → Ubicación → Permitir.';
        else if (err.code === 2) msg += 'Señal GPS no disponible. Probá afuera o cerca de una ventana.';
        else if (err.code === 3) msg += 'Tardó demasiado. Tocá el botón de nuevo.';
        else msg += 'Error desconocido. Código: ' + err.code;
        info.className = 'gps-info mt-2 err';
        info.innerHTML = msg;
        btn.disabled = false;
        btn.classList.remove('processing');
        btnText.textContent = '📍 Reintentar marcar salida';
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  } catch (e) {
    info.className = 'gps-info mt-2 err';
    info.innerHTML = '❌ Error inesperado: ' + (e.message || e);
    btn.disabled = false;
    btn.classList.remove('processing');
    btnText.textContent = '📍 Reintentar marcar salida';
  }
}

function handlePhotoSelect(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;

  const espacio = 10 - photos.length;
  if (espacio <= 0) {
    toast('Ya tienes 10 archivos. Elimina alguno para agregar más.');
    event.target.value = '';
    return;
  }
  const aProcesar = files.slice(0, espacio);
  if (files.length > espacio) {
    toast(`Solo se agregaron los primeros ${espacio} archivos (máximo 10).`);
  }

  let pendientes = aProcesar.length;
  aProcesar.forEach((file) => {
    const esPDF = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    const esImagen = file.type.startsWith('image/');

    if (esImagen) {
      // Compresión optimizada para que el PDF suba a Drive sin fallar.
      // 1000px / calidad 0.6 mantiene legibilidad de evidencias y reduce
      // el peso del archivo ~40% frente a la configuración anterior.
      resizePhoto(file, 1000, 0.6).then((dataUrl) => {
        photos.push({ tipo: 'imagen', dataUrl, name: file.name || `foto-${photos.length + 1}.jpg` });
        pendientes--;
        if (pendientes === 0) { renderPhotoGrid(); pendingDirty = true; }
      }).catch(() => {
        pendientes--;
        if (pendientes === 0) renderPhotoGrid();
      });
    } else if (esPDF) {
      // PDF: lo guardamos en base64 (sin redimensionar) para adjuntarlo aparte
      const reader = new FileReader();
      reader.onload = (e) => {
        photos.push({ tipo: 'pdf', dataUrl: e.target.result, name: file.name || `documento-${photos.length + 1}.pdf` });
        pendientes--;
        if (pendientes === 0) { renderPhotoGrid(); pendingDirty = true; }
      };
      reader.onerror = () => {
        pendientes--;
        if (pendientes === 0) renderPhotoGrid();
      };
      reader.readAsDataURL(file);
    } else {
      toast('Archivo no soportado: ' + file.name);
      pendientes--;
      if (pendientes === 0) renderPhotoGrid();
    }
  });

  event.target.value = '';
}

function resizePhoto(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) {
          h = Math.round((h * maxWidth) / w);
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // Fondo blanco: evita que imágenes con transparencia salgan negras al pasar a JPEG
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function removePhoto(idx) {
  photos.splice(idx, 1);
  renderPhotoGrid();
  pendingDirty = true;
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const counter = document.getElementById('photoCounter');
  counter.textContent = `(${photos.length}/10)`;
  if (!photos.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = photos.map((p, i) => {
    if (p.tipo === 'pdf') {
      const nombreCorto = p.name.length > 18 ? p.name.substring(0, 15) + '...' : p.name;
      return `
        <div class="photo-item pdf-item">
          <div class="pdf-icon">📄</div>
          <div class="pdf-name" title="${p.name}">${nombreCorto}</div>
          <button type="button" class="photo-remove" onclick="removePhoto(${i})" title="Eliminar">×</button>
        </div>
      `;
    }
    return `
      <div class="photo-item">
        <img src="${p.dataUrl}" alt="evidencia ${i+1}">
        <button type="button" class="photo-remove" onclick="removePhoto(${i})" title="Eliminar">×</button>
      </div>
    `;
  }).join('');
}

function poblarSubEquipos(tipo, valorPreseleccionado) {
  const sub = document.getElementById('subEquipoSel');
  const otro = document.getElementById('subEquipoOtro');
  if (!sub) return;
  if (!tipo) {
    sub.innerHTML = '<option value="">— Primero elige el tipo —</option>';
    sub.disabled = true;
    if (otro) { otro.style.display = 'none'; otro.value = ''; }
    return;
  }
  const lista = SUBEQUIPOS[tipo] || [];
  let opts = '<option value="">— Seleccionar —</option>';
  lista.forEach(function(s){ opts += '<option value="' + s + '">' + s + '</option>'; });
  opts += '<option value="Otro">Otro (especificar)</option>';
  sub.innerHTML = opts;
  sub.disabled = false;
  const val = valorPreseleccionado || '';
  if (val && lista.indexOf(val) !== -1) {
    sub.value = val;
    if (otro) { otro.style.display = 'none'; otro.value = ''; }
  } else if (val) {
    sub.value = 'Otro';
    if (otro) { otro.style.display = 'block'; otro.value = val; }
  } else {
    sub.value = '';
    if (otro) { otro.style.display = 'none'; otro.value = ''; }
  }
}

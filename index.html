async function buildPDF(dataParam) {
  const data = dataParam || collectData();
  // Asegurar que los logos ya estén incrustados (ver precargarLogosPDF)
  try { await LOGOS_PDF_LISTOS; } catch (e) {}
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const FONTS = (typeof DEJAVU_FONTS !== 'undefined') ? DEJAVU_FONTS : null;
  const W = doc.internal.pageSize.getWidth();   // 612
  const H = doc.internal.pageSize.getHeight();  // 792
  const M = 36;
  const INNER = W - 2 * M;
  let FONT = 'helvetica';
  if (FONTS) {
    try {
      doc.addFileToVFS('DejaVu.ttf', FONTS.reg); doc.addFont('DejaVu.ttf', 'DejaVu', 'normal');
      doc.addFileToVFS('DejaVu-Bold.ttf', FONTS.bold); doc.addFont('DejaVu-Bold.ttf', 'DejaVu', 'bold');
      FONT = 'DejaVu';
    } catch (e) {}
  }

  // Paleta
  const DARK = [15, 23, 42], BLUE = [30, 159, 232], BLUEINK = [12, 42, 76];
  const BAND = [238, 242, 247], GRAY = [100, 116, 139], INK = [26, 35, 50];
  const GREEN = [22, 163, 74], RED = [220, 38, 38], LINE = [226, 232, 240];

  let y = 0;

  // -------- helpers --------
  function check(x, cy, ok) {
    doc.setLineWidth(1.4);
    if (ok) { doc.setDrawColor(...GREEN); doc.line(x, cy + 1, x + 2.5, cy + 3.5); doc.line(x + 2.5, cy + 3.5, x + 7, cy - 2.5); }
    else { doc.setDrawColor(...RED); doc.line(x, cy - 2.5, x + 6, cy + 3.5); doc.line(x + 6, cy - 2.5, x, cy + 3.5); }
    doc.setLineWidth(0.5);
  }
  function footer(pageNum, pageCount) {
    const fh = 46;
    doc.setFillColor(...DARK); doc.rect(0, H - fh, W, fh, 'F');
    try {
      const p = doc.getImageProperties(LOGOS.grupo);
      const gh = 26, gw = gh * p.width / p.height, pad = 3, bw = gw + pad * 2, bh = gh + pad * 2;
      const by = H - fh + (fh - bh) / 2;
      doc.setFillColor(255, 255, 255); doc.roundedRect(M, by, bw, bh, 2, 2, 'F');
      doc.addImage(LOGOS.grupo, 'PNG', M + pad, by + pad, gw, gh);
      var tx = M + bw + 10;
    } catch (e) { var tx = M; }
    doc.setFont(FONT, 'normal'); doc.setFontSize(6.5); doc.setTextColor(148, 163, 184);
    doc.text('Grupo Empresarial MARC  ·  ' + EMPRESA.razon + '  ·  Céd. ' + EMPRESA.cedula, tx, H - fh + 18);
    doc.text(EMPRESA.ubic + '  ·  ' + EMPRESA.tel + '  ·  ' + EMPRESA.correo, tx, H - fh + 29);
    doc.setTextColor(100, 116, 139);
    doc.text('Página ' + pageNum + ' de ' + pageCount, W - M, H - fh + 18, { align: 'right' });
    // Próximo mantenimiento (recuadro a la derecha)
    const prox = data.proximoMantenimiento || mesesDespues(data.fecha, 4);
    if (prox) {
      doc.setFontSize(6); doc.setTextColor(100, 116, 139);
      doc.text('PRÓXIMO MANTENIMIENTO', W - M, H - fh + 30, { align: 'right' });
      doc.setFontSize(10); doc.setFont(FONT, 'bold'); doc.setTextColor(...BLUE);
      doc.text(prox, W - M, H - fh + 40, { align: 'right' });
    }
  }
  function ensure(space) {
    if (y > H - 46 - space) { doc.addPage(); drawHeaderMini(); }
  }
  function section(title, need) {
    ensure(40 + (need || 0));
    doc.setFillColor(...BAND); doc.rect(M, y, INNER, 17, 'F');
    doc.setFillColor(...BLUE); doc.rect(M, y, 3, 17, 'F');
    doc.setFont(FONT, 'bold'); doc.setFontSize(8.5); doc.setTextColor(...BLUEINK);
    doc.text(title.toUpperCase(), M + 9, y + 11.5);
    y += 25;
  }
  function kv(label, value, x, w) {
    doc.setFont(FONT, 'normal'); doc.setFontSize(7); doc.setTextColor(...GRAY);
    doc.text(label.toUpperCase(), x, y);
    doc.setFontSize(9.5); doc.setTextColor(...INK);
    const lines = doc.splitTextToSize(String(value || '—'), w - 4);
    doc.text(lines, x, y + 11);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.5); doc.line(x, y + 15, x + w, y + 15);
    return (lines.length - 1) * 10;
  }

  // -------- ENCABEZADO --------
  function drawHeaderMini() {
    y = 0;
    const hh = 40;
    doc.setFillColor(...DARK); doc.rect(0, 0, W, hh, 'F');
    try {
      const p = doc.getImageProperties(LOGOS.marcaire);
      const lh = 26, lw = lh * p.width / p.height;
      doc.addImage(LOGOS.marcaire, 'PNG', M, (hh - lh) / 2, lw, lh);
    } catch (e) {}
    doc.setFont(FONT, 'bold'); doc.setFontSize(9); doc.setTextColor(...BLUE);
    doc.text(data.numero, W - M, hh / 2 + 3, { align: 'right' });
    y = hh + 16;
  }
  function drawHeader() {
    const hh = 92;
    doc.setFillColor(...DARK); doc.rect(0, 0, W, hh, 'F');
    doc.setFillColor(...BLUE); doc.rect(0, hh, W, 3, 'F');
    // Logo MARCAIRE
    try {
      const p = doc.getImageProperties(LOGOS.marcaire);
      const lh = 50, lw = lh * p.width / p.height;
      doc.addImage(LOGOS.marcaire, 'PNG', M, (hh - lh) / 2 - 4, lw, lh);
    } catch (e) {}
    // Tarjeta derecha
    const cw = 150, cx = W - M - cw, cyy = 18, chh = 56;
    doc.setFillColor(30, 41, 59); doc.rect(cx, cyy, cw, chh, 'F');
    doc.setFillColor(...BLUE); doc.rect(cx, cyy, cw, 2, 'F');
    doc.setFont(FONT, 'normal'); doc.setFontSize(6.5); doc.setTextColor(148, 163, 184);
    doc.text('CERTIFICADO DE SERVICIO', cx + cw / 2, cyy + 14, { align: 'center' });
    doc.setFont(FONT, 'bold'); doc.setFontSize(17); doc.setTextColor(...BLUE);
    doc.text(data.numero, cx + cw / 2, cyy + 33, { align: 'center' });
    doc.setFont(FONT, 'normal'); doc.setFontSize(7); doc.setTextColor(203, 213, 225);
    doc.text((data.fecha || '') + '  ·  ' + (data.tipoMantenimiento || ''), cx + cw / 2, cyy + 47, { align: 'center' });
    y = hh + 18;
  }

  drawHeader();

  // -------- DATOS DEL CLIENTE Y SERVICIO --------
  section('Datos del cliente y servicio');
  const col = (INNER - 16) / 2;
  let yStart = y;
  kv('Cliente', data.cliente.nombre, M, col);
  kv('Visita N°', data.cliente.visita, M + col + 16, col); y += 30;
  kv('Ubicación', data.cliente.ubicacion, M, col);
  kv('Contacto', data.cliente.contacto, M + col + 16, col); y += 30;
  kv('Técnico', data.autor, M, col);
  kv('Horario', (data.horaInicio || '—') + ' — ' + (data.horaCierre || '—'), M + col + 16, col); y += 30;
  kv('Tipo de mantenimiento', data.tipoMantenimiento, M, col);
  kv('Revisado por', data.revisadoPor, M + col + 16, col); y += 32;

  // -------- EQUIPO --------
  section('Equipo intervenido');
  kv('Tipo de equipo', (data.equipos || []).join(', '), M, col);
  kv('Sub-equipo', data.cliente.subTipo, M + col + 16, col); y += 30;
  kv('Marca / Modelo', data.cliente.modelo, M, col);
  kv('Serie', data.cliente.serie, M + col + 16, col); y += 32;

  // -------- LECTURAS DE OPERACIÓN (tabla) --------
  section('Lecturas de operación');
  const heads = ['Voltaje', 'Amperaje', 'Presión alta', 'Presión baja', 'T. retorno', 'T. suministro'];
  const ops = data.operacion || {};
  const vals = [ops.voltaje, ops.amperaje, ops.presionAlta, ops.presionBaja, ops.tempRetorno, ops.tempSuministro];
  const cwid = INNER / 6, th = 20, tv = 22;
  for (let i = 0; i < 6; i++) {
    const cx = M + i * cwid;
    doc.setFillColor(248, 250, 252); doc.rect(cx, y, cwid, th, 'F');
    doc.setDrawColor(...LINE); doc.rect(cx, y, cwid, th);
    doc.setFont(FONT, 'bold'); doc.setFontSize(6.5); doc.setTextColor(...GRAY);
    doc.text(heads[i].toUpperCase(), cx + cwid / 2, y + 13, { align: 'center' });
  }
  y += th;
  for (let i = 0; i < 6; i++) {
    const cx = M + i * cwid;
    doc.setDrawColor(...LINE); doc.rect(cx, y, cwid, tv);
    doc.setFont(FONT, 'normal'); doc.setFontSize(9); doc.setTextColor(...INK);
    doc.text(String(vals[i] || '—'), cx + cwid / 2, y + 14, { align: 'center' });
  }
  y += tv + 14;

  // -------- TRABAJOS REALIZADOS (todos, ✓/✗) --------
  function checklist(title, items, done) {
    section(title, 20);
    const set = new Set(done || []);
    const cw2 = (INNER - 16) / 2, rowH = 15;
    for (let i = 0; i < items.length; i++) {
      const colIdx = i % 2;
      if (colIdx === 0) ensure(rowH + 4);
      const x = M + colIdx * (cw2 + 16);
      const ok = set.has(items[i]);
      check(x + 2, y + 2, ok);
      doc.setFont(FONT, 'normal'); doc.setFontSize(8); doc.setTextColor(...(ok ? INK : [148, 163, 184]));
      const t = doc.splitTextToSize(items[i], cw2 - 16);
      doc.text(t[0], x + 14, y + 4);
      if (colIdx === 1 || i === items.length - 1) y += rowH;
    }
    y += 10;
  }
  const tipo = (data.tipoEquipo || '').toLowerCase();
  const showAC = !tipo || tipo.includes('aire') || tipo.includes('ac') || tipo.includes('split') || (data.acDone && data.acDone.length);
  const showVENT = tipo.includes('vent') || tipo.includes('extra') || (data.ventDone && data.ventDone.length);
  if (showAC) checklist('Mantenimiento de aire acondicionado', AC_ITEMS, data.acDone);
  if (showVENT) checklist('Mantenimiento de sistemas de ventilación', VENT_ITEMS, data.ventDone);

  // -------- EVIDENCIA FOTOGRÁFICA --------
  const imgs = (data.fotos || []).filter(f => !f.tipo || f.tipo === 'imagen');
  if (imgs.length) {
    const cols = 3, gap = 10, cw3 = (INNER - gap * (cols - 1)) / cols, ch3 = cw3 * 0.72;
    section('Evidencia fotográfica', ch3 + 20);
    let cidx = 0;
    for (let i = 0; i < imgs.length; i++) {
      if (cidx === 0) ensure(ch3 + 18);
      const x = M + cidx * (cw3 + gap);
      const url = imgs[i].dataUrl || imgs[i];
      doc.setDrawColor(...LINE); doc.rect(x, y, cw3, ch3);
      try { doc.addImage(url, 'JPEG', x + 1, y + 1, cw3 - 2, ch3 - 2); } catch (e) {}
      doc.setFontSize(6.5); doc.setTextColor(...GRAY);
      doc.text('Foto ' + (i + 1), x + cw3 / 2, y + ch3 + 9, { align: 'center' });
      cidx++;
      if (cidx >= cols) { cidx = 0; y += ch3 + 16; }
    }
    if (cidx !== 0) y += ch3 + 16;
  }

  // -------- OBSERVACIONES / RECOMENDACIONES --------
  if (data.observaciones || data.comentarios) {
    section('Observaciones y recomendaciones');
    doc.setFont(FONT, 'normal'); doc.setFontSize(9); doc.setTextColor(...INK);
    if (data.observaciones) {
      const t = doc.splitTextToSize(data.observaciones, INNER); ensure(t.length * 12 + 6);
      doc.text(t, M, y); y += t.length * 12 + 6;
    }
    if (data.comentarios) {
      const t = doc.splitTextToSize(data.comentarios, INNER); ensure(t.length * 12 + 6);
      doc.setTextColor(...GRAY); doc.text(t, M, y); y += t.length * 12 + 6;
    }
    y += 6;
  }

  // -------- COTIZACIÓN ADICIONAL --------
  if (data.cotizacionAdicional) {
    const t = doc.splitTextToSize(data.cotizacionAdicional, INNER - 24);
    const boxH = 22 + t.length * 11;
    ensure(boxH + 6);
    doc.setFillColor(255, 247, 237); doc.rect(M, y, INNER, boxH, 'F');
    doc.setFillColor(245, 158, 11); doc.rect(M, y, 3, boxH, 'F');
    doc.setFont(FONT, 'bold'); doc.setFontSize(8); doc.setTextColor(146, 64, 14);
    doc.text('COTIZACIÓN ADICIONAL SUGERIDA', M + 10, y + 13);
    doc.setFont(FONT, 'normal'); doc.setFontSize(9); doc.setTextColor(120, 53, 15);
    doc.text(t, M + 10, y + 25);
    y += boxH + 14;
  }

  // -------- FIRMAS --------
  ensure(96);
  section('Firmas');
  const sw = (INNER - 24) / 3, sh = 56;
  function firma(label, name, sig, x) {
    doc.setDrawColor(...LINE); doc.setFillColor(252, 252, 253); doc.rect(x, y, sw, sh, 'FD');
    if (sig) { try { doc.addImage(sig, 'PNG', x + 3, y + 3, sw - 6, sh - 6); } catch (e) {} }
    doc.setDrawColor(...GRAY); doc.line(x + 8, y + sh + 10, x + sw - 8, y + sh + 10);
    doc.setFont(FONT, 'bold'); doc.setFontSize(8); doc.setTextColor(...INK);
    doc.text(name || '—', x + sw / 2, y + sh + 22, { align: 'center' });
    doc.setFont(FONT, 'normal'); doc.setFontSize(6.5); doc.setTextColor(...GRAY);
    doc.text(label, x + sw / 2, y + sh + 31, { align: 'center' });
  }
  const f = data.firmas || {};
  firma('TÉCNICO ENCARGADO', f.tecnico, f.sigTecnico, M);
  firma('TÉCNICO AYUDANTE', f.ayudante, f.sigAyudante, M + sw + 12);
  firma('CLIENTE — CONFORME', f.cliente, f.sigCliente, M + 2 * (sw + 12));
  y += sh + 40;

  // -------- pies en todas las páginas --------
  const pages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); footer(p, pages); }
  return { doc, data };
}

async function generatePDF() {
  const data = collectData();
  if (!data.cliente.nombre) {
    if (!confirm('El nombre del cliente está vacío. ¿Generar el PDF de todos modos?')) return;
  }
  const { doc } = await buildPDF(data);
  const filename = data.numero + '_' + (data.cliente.nombre || 'cliente').replace(/[^a-zA-Z0-9]/g, '_') + '.pdf';
  descargarPDF(doc, filename);

  // Auto-guardar y avanzar contador
  await persistAndAdvance(data);
  toast('✓ PDF descargado: ' + data.numero);
}

async function sharePDF() {
  if (!driveUrl) {
    toast('No hay conexión con el servidor. Contacta al administrador.');
    return;
  }
  const data = collectData();
  if (!data.cliente.nombre) {
    if (!confirm('El nombre del cliente está vacío. ¿Enviar de todos modos?')) return;
  }
  const btn = document.getElementById('btnEnviar');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
  window._subiendoDrive = true;   // pausa la migración en segundo plano
  toast('☁️ Generando PDF...');

  let doc;
  // Reservar número único en el Worker ANTES de generar el PDF (anti-choque multiusuario)
  await reservarNumero(data);
  try {
    doc = (await buildPDF(data)).doc;
  } catch (e) {
    window._subiendoDrive = false;
    if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
    toast('No se pudo generar el PDF: ' + (e.message || e));
    return;
  }

  // Guardar local SIEMPRE primero: pase lo que pase, el certificado no se pierde.
  await persistAndAdvance(data);

  toast('☁️ Enviando...');
  const r = await subirADrive(data, doc);
  if (r.confirmado) toast('✅ Enviado: ' + data.numero);
  else toast('⚠️ Quedó en cola para reintentar (toca "☁️ por enviar").');

  window._subiendoDrive = false;
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
  updatePendingBadge();
  cargarListaClientes();   // el cliente queda disponible para todos
  if (_editando) { _editando = null; const eb = document.getElementById('editBanner'); if (eb) eb.style.display = 'none'; }
  syncCounterFromDrive().then(() => updateCertNumber()).catch(() => {});
}

// Descarga un PDF de forma robusta. doc.save() de jsPDF a veces falla en
// Chrome OS con "descarga fallida"; este método usa un Blob con enlace explícito
// agregado al DOM, que es más confiable. Si aun así falla, abre el PDF en una
// pestaña nueva para que el usuario lo guarde a mano.
function descargarPDF(doc, filename) {
  try {
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 4000);
    return true;
  } catch (e) {
    // Último recurso: abrir en pestaña nueva
    try {
      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      return true;
    } catch (e2) {
      toast('No se pudo descargar el PDF en este dispositivo. Usa "📤 Enviar".');
      return false;
    }
  }
}

// Convierte un PDF (doc jsPDF) a base64 de forma segura para archivos grandes.
// El método byte-por-byte con String.fromCharCode falla o se traba con PDFs
// pesados; este procesa en bloques para no reventar la pila del navegador.
function pdfDocToBase64(doc) {
  const arrayBuffer = doc.output('arraybuffer');
  const bytes = new Uint8Array(arrayBuffer);
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.byteLength; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

// POST a Apps Script con timeout real y reintentos automáticos.
// Apps Script responde con un redirect 302; redirect:'follow' lo maneja.
// Enviamos el cuerpo como texto plano (sin header que dispare preflight CORS).
// Envía el certificado (datos + PDF) al Worker (Cloudflare).
// El cuerpo va como texto plano (petición "simple", sin preflight CORS).
// Como el Worker SÍ responde con CORS abierto, podemos LEER su respuesta y
// confirmar de verdad cada guardado (antes, con Apps Script, era opaca y había
// que "asumir" que llegó).
async function postToDrive(payloadStr, { timeoutMs = 120000 } = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(driveUrl, {
      method: 'POST',
      body: payloadStr,   // sin headers => Content-Type text/plain => petición simple, sin preflight
      signal: controller.signal
    });
    clearTimeout(timer);
    // El Worker tiene CORS abierto: SÍ podemos leer la respuesta y confirmar de verdad.
    let data = null;
    try { data = await res.json(); } catch (e) { /* respuesta no legible: caemos al respaldo */ }
    return { ok: true, data };
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') {
      throw new Error('La subida tardó demasiado (archivo muy pesado o conexión lenta).');
    }
    throw e;
  }
}

// VERIFICACIÓN REAL DE SUBIDA.
// Como el POST es opaco (no-cors), no podemos leer si Apps Script tuvo éxito.
// Pero el GET (action=list) SÍ es legible. Así que tras subir, preguntamos a
// Drive si el certificado con ese número ya aparece. Si aparece, la subida fue
// real y confirmada. Si no, hubo un fallo silencioso y lo dejamos en cola.
// Reintenta unas cuantas veces porque Drive puede tardar un par de segundos.
async function verificarEnDrive(numero) {
  if (!driveUrl || !numero) return false;
  const objetivo = String(numero).trim().toUpperCase();
  const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
  for (let intento = 0; intento < 4; intento++) {
    await new Promise(r => setTimeout(r, intento === 0 ? 1800 : 2800));
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      const res = await fetch(driveUrl + sep + 'action=list&_=' + Date.now(), {
        method: 'GET', redirect: 'follow', signal: controller.signal
      });
      clearTimeout(timer);
      const d = await res.json();
      if (d && Array.isArray(d.certs)) {
        const hit = d.certs.some(c => String(c.numero || '').trim().toUpperCase() === objetivo);
        if (hit) return true;
      }
    } catch (e) { /* reintentar */ }
  }
  return false;
}

// Sube un PDF ya generado a Drive, con verificación real. Devuelve
// { confirmado:true } si el archivo quedó confirmado en Drive, o
// Reserva ATÓMICA del consecutivo en el Worker: garantiza que dos técnicos NUNCA
// usen el mismo número (anti-choque multiusuario). Si no hay conexión, mantiene el
// número local. Reasigna data.numero al número reservado por el servidor.
async function reservarNumero(data) {
  if (!driveUrl) return;
  // MODO EDICIÓN: si se está reabriendo un certificado, se conserva su número
  // (el Worker hace UPDATE bajo el mismo consecutivo, no crea uno nuevo).
  if (_editando) {
    data.numero = _editando;
    const m = String(_editando).match(/(\d+)\s*$/);
    if (m) currentNumber = parseInt(m[1], 10);
    updateCertNumber();
    return;
  }
  try {
    const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(driveUrl + sep + 'action=reserve&_=' + Date.now(), { method: 'GET', redirect: 'follow', signal: controller.signal });
    clearTimeout(timer);
    const jd = await res.json();
    if (jd && jd.ok && jd.numero != null) {
      const n = parseInt(jd.numero, 10);
      if (!isNaN(n) && n > 0) {
        currentNumber = n;
        data.numero = 'SGM-' + n;
        updateCertNumber();
      }
    }
  } catch (e) { /* offline/timeout: se mantiene el número local */ }
}

// { confirmado:false } si quedó en cola para reintentar. NO toca el contador
// (el certificado ya se guardó/numeró antes de llamar a esta función).
async function subirADrive(data, doc) {
  const numero = data.numero;
  const filename = numero + '_' + (data.cliente.nombre || 'cliente').replace(/[^a-zA-Z0-9]/g, '_') + '.pdf';
  const pdfBase64 = pdfDocToBase64(doc);
  const payloadStr = JSON.stringify({ pdfBase64, filename, certData: stripPhotosForDrive(data) });
  try {
    const r = await postToDrive(payloadStr);
    // Confirmación REAL e instantánea: el Worker responde {ok:true,numero,...}
    let confirmado = !!(r && r.data && r.data.ok);
    // Respaldo (por si la respuesta no se pudo leer): verificación por lista
    if (!confirmado) confirmado = await verificarEnDrive(numero);
    if (confirmado) {
      try { await window.storage.delete('pending:' + numero); } catch (e) {}
      // Guardar el link del PDF en el historial local para verlo/descargarlo
      try {
        const urlPdf = (r && r.data && (r.data.url || r.data.pdfUrl)) ||
          (driveUrl + '/archivo/mantenimiento/' + String(numero).replace(/[^a-zA-Z0-9_-]/g, '_') + '.pdf');
        const g = await window.storage.get('cert:' + numero).catch(() => null);
        if (g && g.value) {
          const cPrev = JSON.parse(g.value);
          cPrev.driveUrl = urlPdf;
          await window.storage.set('cert:' + numero, JSON.stringify(cPrev));
        }
      } catch (e) {}
      return { confirmado: true };
    }
    await guardarEnCola(data, pdfBase64, filename);
    return { confirmado: false };
  } catch (e) {
    console.error('Drive error:', e);
    await guardarEnCola(data, pdfBase64, filename);
    return { confirmado: false, error: e.message || String(e) };
  }
}

async function sendToDrive() {
  if (!driveUrl) {
    toast('No hay conexión con el servidor. Contacta al administrador.');
    return;
  }
  const data = collectData();
  if (!data.cliente.nombre) {
    if (!confirm('El nombre del cliente está vacío. ¿Subir de todos modos?')) return;
  }
  const driveBtn = document.querySelector('button[onclick="sendToDrive()"]');
  if (driveBtn) { driveBtn.disabled = true; driveBtn.style.opacity = '0.6'; }
  window._subiendoDrive = true;   // pausa la migración en segundo plano
  toast('☁️ Generando PDF...');

  let doc;
  // Reservar número único en el Worker ANTES de generar el PDF (anti-choque multiusuario)
  await reservarNumero(data);
  try {
    doc = (await buildPDF(data)).doc;
  } catch (e) {
    window._subiendoDrive = false;
    if (driveBtn) { driveBtn.disabled = false; driveBtn.style.opacity = '1'; }
    toast('No se pudo generar el PDF: ' + (e.message || e));
    return;
  }

  // GUARDAR SIEMPRE LOCAL PRIMERO: pase lo que pase, el certificado no se pierde.
  await persistAndAdvance(data);

  toast('☁️ Enviando y confirmando...');
  const r = await subirADrive(data, doc);
  if (r.confirmado) toast('✅ Enviado y confirmado: ' + data.numero);
  else toast('⚠️ No se pudo confirmar ' + data.numero + '. Quedó en cola (toca "☁️ por enviar").');

  window._subiendoDrive = false;
  if (driveBtn) { driveBtn.disabled = false; driveBtn.style.opacity = '1'; }
  updatePendingBadge();
  cargarListaClientes();   // el nuevo cliente queda disponible para todos
  syncCounterFromDrive().then(() => updateCertNumber()).catch(() => {});
}

// Quita las imágenes en base64 de los datos que viajan a Drive como metadata
// (el PDF ya las lleva embebidas; mandarlas de nuevo duplica el peso).
function stripPhotosForDrive(data) {
  return { ...data, fotos: (data.fotos || []).map(f => ({ tipo: f.tipo, name: f.name })) };
}

// ============== COLA DE PENDIENTES (reintento de subidas fallidas) ==============
// Si Drive falla, el PDF queda guardado localmente para reintentar luego,
// sin perder el trabajo ni bloquear al técnico en el sitio.
// Guarda el payload completo (con PDF) para reintentar la subida después.
// NO toca el contador: el certificado ya se guardó y numeró en sendToDrive.
async function guardarEnCola(data, pdfBase64, filename) {
  try {
    await window.storage.set('pending:' + data.numero, JSON.stringify({
      numero: data.numero,
      filename,
      pdfBase64,
      certData: stripPhotosForDrive(data),
      cliente: data.cliente.nombre || '',
      fecha: data.fecha,
      savedAt: new Date().toISOString()
    }));
  } catch (e) {
    console.error('No se pudo guardar en cola:', e);
  }
}

async function contarPendientes() {
  try {
    const r = await window.storage.list('pending:');
    return (r && r.keys) ? r.keys.length : 0;
  } catch { return 0; }
}

async function updatePendingBadge() {
  const n = await contarPendientes();
  const badge = document.getElementById('pendingBadge');
  if (!badge) return;
  if (n > 0) {
    badge.style.display = 'inline-flex';
    badge.textContent = '☁️ ' + n + ' por enviar';
  } else {
    badge.style.display = 'none';
  }
}

async function reintentarPendientes() {
  if (!driveUrl) { toast('No hay conexión con el servidor'); return; }
  const r = await window.storage.list('pending:');
  if (!r || !r.keys || r.keys.length === 0) { toast('No hay envíos pendientes ✓'); return; }

  window._subiendoDrive = true;
  toast('Reintentando ' + r.keys.length + ' pendiente(s)...');
  let exito = 0, fallo = 0;
  for (const key of r.keys) {
    try {
      const item = JSON.parse((await window.storage.get(key)).value);
      // Si ya está en Drive (de un intento anterior), solo limpiar la cola.
      let yaEsta = await verificarEnDrive(item.numero);
      if (!yaEsta) {
        const payloadStr = JSON.stringify({
          pdfBase64: item.pdfBase64,
          filename: item.filename,
          certData: item.certData
        });
        await postToDrive(payloadStr);
        yaEsta = await verificarEnDrive(item.numero);
      }
      if (yaEsta) {
        await window.storage.delete(key);
        exito++;
      } else {
        fallo++;
      }
    } catch (e) { fallo++; }
  }
  window._subiendoDrive = false;
  updatePendingBadge();
  toast('Subidas confirmadas: ' + exito + ' ✓' + (fallo ? '  ·  ' + fallo + ' aún fallan' : ''));
  if (document.getElementById('historyModal').classList.contains('show')) showHistory();
}

// Guarda el certificado bajo SU número (que nunca cambia en pantalla) y
// reserva el siguiente consecutivo para el PRÓXIMO certificado.
// El número solo avanza al presionar "Nuevo certificado".
async function persistAndAdvance(data) {
  try {
    // Para el historial local: guardamos metadatos de fotos pero NO las imágenes (pesarían demasiado)
    const dataParaHistorial = {
      ...data,
      fotos: data.fotos ? data.fotos.map((_, i) => '__foto_' + (i+1) + '__') : [],
      savedAt: new Date().toISOString()
    };
    // SEGURIDAD ANTI-PÉRDIDA: si ya existía un certificado con este número
    // (por reuso accidental), guardamos la versión anterior con marca de tiempo
    // para que nunca se pierda al sobrescribir.
    try {
      const previo = await window.storage.get('cert:' + data.numero);
      if (previo && previo.value) {
        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        await window.storage.set('ver:' + data.numero + ':' + stamp, previo.value);
      }
    } catch (e) {}

    await window.storage.set('cert:' + data.numero, JSON.stringify(dataParaHistorial));
    // CONSECUTIVO AMARRADO: el número en pantalla NO cambia al guardar,
    // descargar ni enviar. Solo se reserva el siguiente para el próximo.
    const numActual = parseInt(String(data.numero).replace(/\D/g, ''), 10) || currentNumber;
    let reservado = 0;
    try {
      const cc = await window.storage.get('certCounter');
      if (cc && cc.value) reservado = parseInt(cc.value, 10) || 0;
    } catch (e) {}
    await window.storage.set('certCounter', String(Math.max(reservado, numActual + 1)));
    pendingDirty = false;
  } catch (e) {
    console.error('Error al persistir:', e);
  }
}

// ============== GUARDAR Y CARGAR ==============
async function saveCertificate() {
  const data = collectData();
  if (!data.cliente.nombre) {
    toast('Falta nombre del cliente');
    return;
  }
  await persistAndAdvance(data);
  toast('💾 Guardado en este equipo (' + data.numero + '). Para enviarlo a la nube, toca "📤 Enviar".');
  if (_editando) { _editando = null; const eb = document.getElementById('editBanner'); if (eb) eb.style.display = 'none'; }
  cargarListaClientes();
}

// ============== DASHBOARD / RESUMEN ==============
// Primero trae los servicios desde Drive (todos los técnicos) y luego dibuja
// las estadísticas: total de servicios, este mes, equipos más atendidos y
// clientes, leyendo todos los certificados guardados localmente + los de Drive.
async function showDashboard() {
  const content = document.getElementById('dashboardContent');
  content.innerHTML = '<div class="text-center text-slate-500 py-6">🔄 Trayendo servicios...</div>';
  document.getElementById('dashboardModal').classList.add('show');
  // Sincroniza en silencio (si el Apps Script no está actualizado, sigue con lo local)
  await sincronizarDesdeDrive(true);
  await renderDashboard();
}

async function renderDashboard() {
  const content = document.getElementById('dashboardContent');
  if (!content) return;

  try {
    // TODOS los certificados de la empresa desde el Worker (base compartida en D1).
    // Antes se leía solo el almacenamiento local de la tablet, por eso cada quien
    // veía únicamente sus propios PDF. Ahora el dashboard es global.
    let certs = [];
    try {
      const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
      const res = await fetch(driveUrl + sep + 'action=list&_=' + Date.now(), { method: 'GET', redirect: 'follow' });
      const jd = await res.json();
      if (jd && Array.isArray(jd.certs)) {
        certs = jd.certs.map(c => ({
          numero: c.numero || '',
          cliente: normalizarNombre(c.cliente) || 'Sin cliente',   // v142: agrupa sin duplicar
          visita: c.visita || '',
          fecha: c.fecha || (c.timestamp ? String(c.timestamp).slice(0, 10) : ''),
          url: c.url || '',
          // v134+: el Worker ya envía estos campos (antes no llegaban y salían vacíos)
          tipoEquipo: c.tipoEquipo || c.tipo_equipo || c.equipos || '',
          sistema: c.sistema || c.tipoSistema || c.tipo_equipo || c.equipos || '',
          subEquipo: c.subEquipo || c.subTipo || c.sub_equipo || '',
          ubicacion: c.ubicacion || '',
          cotizacion: c.cotizacionAdicional || c.cotizacion || '',
          historico: !!c.historico,
          raw: c
        }));
      }
    } catch (e) { /* si el Worker no responde, seguimos con lo local */ }
    // Sumar certificados locales que aún no se subieron (para no perder ninguno)
    try {
      const result = await window.storage.list('cert:');
      const keys = (result && result.keys) ? result.keys : [];
      const locales = (await Promise.all(keys.map(async k => {
        try { return JSON.parse((await window.storage.get(k)).value); } catch { return null; }
      }))).filter(Boolean);
      const yaHay = new Set(certs.map(c => c.numero));
      for (const c of locales) {
        if (c && c.numero && !yaHay.has(c.numero)) {
          const nombre = normalizarNombre(c.cliente && c.cliente.nombre);   // v142
          certs.push({
            numero: c.numero || '',
            cliente: nombre || 'Sin cliente',
            visita: (c.cliente && c.cliente.visita) ? String(c.cliente.visita) : '',
            fecha: c.fecha || (c.savedAt ? c.savedAt.slice(0, 10) : '') || '',
            url: c.driveUrl || '',
            tipoEquipo: c.tipoEquipo || (Array.isArray(c.equipos) ? c.equipos.join(', ') : (c.equipos || '')),
            sistema: c.tipoEquipo || (Array.isArray(c.equipos) ? c.equipos.join(', ') : (c.equipos || '')),
            subEquipo: (c.cliente && c.cliente.subTipo) ? String(c.cliente.subTipo) : '',
            ubicacion: (c.cliente && c.cliente.ubicacion) ? String(c.cliente.ubicacion) : '',
            cotizacion: c.cotizacionAdicional || '',
            raw: c
          });
        }
      }
    } catch (e) {}

    // Filtro por cliente (si el CEO escribe en la barra de búsqueda)
    const filtro = (document.getElementById('dashClienteFiltro') || {}).value || '';
    const certsFiltrados = filtro.trim()
      ? certs.filter(c => c.cliente.toLowerCase().includes(filtro.trim().toLowerCase()))
      : certs;

    // Subtítulo con fecha de generación
    const sub = document.getElementById('dashSubtitle');
    if (sub) sub.textContent = 'Generado el ' + new Date().toLocaleDateString('es-CR', { day: '2-digit', month: 'long', year: 'numeric' }) +
      (filtro.trim() ? ' · Filtro: "' + filtro.trim() + '"' : '');

    if (certs.length === 0) {
      content.innerHTML = `
        <div style="text-align:center; color:#64748b; padding:40px 0;">
          <div style="font-size:48px; margin-bottom:8px;">📋</div>
          <div>Aún no hay servicios registrados.</div>
          <div style="font-size:0.85rem; margin-top:4px;">Toca "Actualizar" para traer los mantenimientos.</div>
        </div>`;
      return;
    }

    const base = certsFiltrados;

    // ===== Métricas =====
    const ahora = new Date();
    const mesActual = ahora.getFullYear() + '-' + String(ahora.getMonth() + 1).padStart(2, '0');
    const mesAnteriorDate = new Date(ahora.getFullYear(), ahora.getMonth() - 1, 1);
    const mesAnterior = mesAnteriorDate.getFullYear() + '-' + String(mesAnteriorDate.getMonth() + 1).padStart(2, '0');
    const esteMes = base.filter(c => (c.fecha || '').startsWith(mesActual)).length;
    const mesPasado = base.filter(c => (c.fecha || '').startsWith(mesAnterior)).length;

    // Por cliente: cantidad de informes + visitas distintas + fechas
    const porCliente = {};
    base.forEach(c => {
      if (!porCliente[c.cliente]) porCliente[c.cliente] = { servicios: 0, fechas: [], lista: [], visitasSet: new Set() };
      porCliente[c.cliente].servicios++;
      if (c.fecha) porCliente[c.cliente].fechas.push(c.fecha);
      if (c.visita) porCliente[c.cliente].visitasSet.add(String(c.visita));
      porCliente[c.cliente].lista.push({ numero: c.numero, fecha: c.fecha, visita: c.visita, url: c.url });
    });
    const clientesOrden = Object.entries(porCliente).sort((a, b) => b[1].servicios - a[1].servicios);
    const numClientes = clientesOrden.length;
    // Total de visitas (suma de visitas distintas por cliente)
    const totalVisitas = clientesOrden.reduce((s, [, info]) => s + info.visitasSet.size, 0);

    // Por mes (últimos 12 meses) para la tendencia
    const meses = [];
    for (let i = 11; i >= 0; i--) {
      const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      meses.push({ key, label: d.toLocaleDateString('es-CR', { month: 'short' }).replace('.', ''), anio: d.getFullYear(), n: 0 });
    }
    const mesIndex = {}; meses.forEach((m, i) => mesIndex[m.key] = i);
    base.forEach(c => { const k = (c.fecha || '').slice(0, 7); if (k in mesIndex) meses[mesIndex[k]].n++; });
    const totalUltimos12 = meses.reduce((s, m) => s + m.n, 0);
    const promedioMensual = (totalUltimos12 / 12);

    // Variación mes vs mes anterior
    let variacion = '', varColor = '#64748b';
    if (mesPasado > 0) {
      const pct = Math.round(((esteMes - mesPasado) / mesPasado) * 100);
      variacion = (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%';
      varColor = pct >= 0 ? '#047857' : '#b91c1c';
    } else if (esteMes > 0) { variacion = 'nuevo'; varColor = '#047857'; }

    // ===== Tarjetas KPI =====
    const kpi = (valor, etiqueta, extra, extraColor) => `
      <div style="flex:1; min-width:140px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px;">
        <div style="font-size:1.9rem; font-weight:800; color:#0c4a6e; line-height:1;">${valor}</div>
        <div style="font-size:0.72rem; color:#64748b; margin-top:5px; text-transform:uppercase; letter-spacing:0.04em;">${etiqueta}</div>
        ${extra ? `<div style="font-size:0.78rem; font-weight:700; color:${extraColor || '#64748b'}; margin-top:6px;">${extra}</div>` : ''}
      </div>`;

    let html = `<div style="display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;">
      ${kpi(base.length, 'Informes totales', '', '')}
      ${kpi(totalVisitas, 'Visitas realizadas', 'visitas a sitio', '#64748b')}
      ${kpi(esteMes, 'Este mes', variacion + (mesPasado ? ' vs mes anterior' : ''), varColor)}
      ${kpi(numClientes, 'Clientes atendidos', '', '')}
      ${kpi(promedioMensual.toFixed(1), 'Promedio mensual', 'informes/mes (12m)', '#64748b')}
    </div>`;

    // ===== Gráfico de tendencia mensual (barras SVG) =====
    html += seccionTendencia(meses);

    // ===== Top clientes (barras horizontales SVG) =====
    html += seccionClientes(clientesOrden);

    // ===== Aviso de informes históricos (importados sin detalle) =====
    const nHist = base.filter(c => c.historico).length;
    if (nHist > 0) {
      html += `<div style="background:#fffbeb; border:1px solid #fde68a; border-left:3px solid #f59e0b; border-radius:8px; padding:10px 12px; margin-bottom:16px; font-size:0.78rem; color:#92400e; line-height:1.5;">
        <span style="font-weight:700;">ℹ️ ${nHist} ${nHist === 1 ? 'informe histórico' : 'informes históricos'}</span> —
        se importaron del sistema anterior y solo trajeron número, fecha, cliente y el PDF.
        Su detalle (tipo de equipo, técnico, lecturas) está dentro del PDF: abrilo con <strong>👁️ Ver</strong>.
        Los informes nuevos sí guardan todos los datos.
      </div>`;
    }

    // ===== Desglose por tipo de equipo y sistema =====
    html += seccionEquipos(base);

    // ===== Detalle por cliente con fechas (desplegable) =====
    html += `<div style="margin-bottom:18px;">
      <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">📁 Detalle por cliente</div>`;
    clientesOrden.forEach(([nombre, info]) => {
      const fechasOrden = info.lista.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
      const ultima = fechasOrden.length ? formatoFechaLarga(fechasOrden[0].fecha) : '—';
      const primera = fechasOrden.length ? formatoFechaLarga(fechasOrden[fechasOrden.length - 1].fecha) : '—';
      const nVisitas = info.visitasSet.size;
      const visitasTxt = nVisitas > 0 ? (nVisitas + (nVisitas === 1 ? ' visita' : ' visitas')) : 'sin visita reg.';
      // Resumen de qué se le atiende a este cliente, visible sin abrir el desplegable
      const tiposCli = [...new Set(fechasOrden.map(s => s.tipoEquipo).filter(Boolean))];
      const sistCli = [...new Set(fechasOrden.map(s => s.subEquipo || s.sistema).filter(Boolean))];
      const chip = (txt, bg, col) => `<span style="background:${bg}; color:${col}; font-size:0.68rem; font-weight:600; padding:2px 8px; border-radius:10px; margin-right:4px; display:inline-block; margin-bottom:3px;">${escapeHTML(txt)}</span>`;
      const chipsEquipos = tiposCli.slice(0, 4).map(t => chip(t, '#e0f2fe', '#075985')).join('')
        + (tiposCli.length > 4 ? `<span style="font-size:0.68rem; color:#94a3b8;">+${tiposCli.length - 4}</span>` : '');
      const chipsSistemas = sistCli.slice(0, 4).map(t => chip(t, '#f1f5f9', '#475569')).join('')
        + (sistCli.length > 4 ? `<span style="font-size:0.68rem; color:#94a3b8;">+${sistCli.length - 4}</span>` : '');
      html += `<details style="border:1px solid #e2e8f0; border-radius:10px; margin-bottom:8px; overflow:hidden;">
        <summary style="cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; background:#f8fafc; list-style:none;">
          <span style="display:flex; flex-direction:column; gap:2px; min-width:0;">
            <span style="font-weight:700; color:#1e293b;">${escapeHTML(nombre)}</span>
            ${tiposCli.length ? `<span style="margin-top:3px;">${chipsEquipos}</span>` : ''}
          </span>
          <span style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:0.72rem; color:#64748b;">Último: ${ultima}</span>
            <span style="background:#0e7490; color:#fff; font-size:0.74rem; font-weight:700; padding:2px 9px; border-radius:12px;">🚩 ${nVisitas} ${nVisitas === 1 ? 'visita' : 'visitas'}</span>
            <span style="background:#0c4a6e; color:#fff; font-size:0.74rem; font-weight:700; padding:2px 9px; border-radius:12px;">📄 ${info.servicios}</span>
          </span>
        </summary>
        <div style="padding:6px 14px 12px;">
          <div style="font-size:0.72rem; color:#94a3b8; margin:6px 0;">Primer servicio: ${primera} · ${visitasTxt} · ${info.servicios} ${info.servicios === 1 ? 'informe' : 'informes'}</div>
          ${sistCli.length ? `<div style="font-size:0.72rem; color:#64748b; margin:2px 0 8px;"><span style="font-weight:600;">Sistemas:</span> ${chipsSistemas}</div>` : ''}
          <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
            <thead><tr style="text-align:left; color:#64748b; border-bottom:1px solid #e2e8f0;">
              <th style="padding:5px 4px; font-weight:600;">N° Servicio</th>
              <th style="padding:5px 4px; font-weight:600;">Visita</th>
              <th style="padding:5px 4px; font-weight:600;">Ubicación</th>
              <th style="padding:5px 4px; font-weight:600;">Fecha</th>
              <th style="padding:5px 4px; font-weight:600;">Tipo de equipo</th>
              <th style="padding:5px 4px; font-weight:600;">Sistema</th>
              <th style="padding:5px 4px; font-weight:600;">PDF</th>
              <th style="padding:5px 4px; font-weight:600;">Recomendación / Cotización</th>
            </tr></thead>
            <tbody>
              ${fechasOrden.map(s => `<tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:5px 4px; color:#1e293b; font-weight:600;">${escapeHTML(s.numero || '—')}</td>
                <td style="padding:5px 4px; color:#475569;">${s.visita ? 'Visita #' + escapeHTML(s.visita) : '—'}</td>
                <td style="padding:5px 4px; color:#475569;">${celdaDato(s.ubicacion, s.historico)}</td>
                <td style="padding:5px 4px; color:#475569;">${formatoFechaLarga(s.fecha)}</td>
                <td style="padding:5px 4px; color:#475569;">${celdaDato(s.tipoEquipo, s.historico)}</td>
                <td style="padding:5px 4px; color:#475569;">${celdaDato(s.subEquipo || s.sistema, s.historico)}</td>
                <td style="padding:5px 4px; white-space:nowrap;">${s.url ? `<a href="${escapeHTML(s.url)}" target="_blank" rel="noopener" style="color:#0284c7; font-weight:700; text-decoration:none;">👁️ Ver</a>` : '—'}${` <a onclick='editarCert(${JSON.stringify(s.numero)})' style="color:#b45309; font-weight:700; cursor:pointer; margin-left:6px;">✏️ Editar</a>`}</td>
                <td style="padding:5px 4px; color:#b45309;">${celdaDato(s.cotizacion, s.historico)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </details>`;
    });
    html += `</div>`;

    // ===== Servicios recientes =====
    const recientes = base.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).slice(0, 12);
    html += `<div>
      <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">🕑 Servicios recientes</div>
      <table style="width:100%; border-collapse:collapse; font-size:0.84rem;">
        <thead><tr style="text-align:left; color:#64748b; border-bottom:2px solid #e2e8f0;">
          <th style="padding:7px 4px; font-weight:600;">N° Servicio</th>
          <th style="padding:7px 4px; font-weight:600;">Cliente</th>
          <th style="padding:7px 4px; font-weight:600;">Tipo de equipo</th>
          <th style="padding:7px 4px; font-weight:600;">Sistema</th>
          <th style="padding:7px 4px; font-weight:600;">Fecha</th>
          <th style="padding:7px 4px; font-weight:600;">PDF</th>
        </tr></thead>
        <tbody>
          ${recientes.map((c, i) => `<tr style="background:${i % 2 ? '#f8fafc' : '#fff'}; border-bottom:1px solid #f1f5f9;">
            <td style="padding:7px 4px; font-weight:700; color:#0c4a6e;">${escapeHTML(c.numero || '—')}</td>
            <td style="padding:7px 4px; color:#1e293b;">${escapeHTML(c.cliente)}</td>
            <td style="padding:7px 4px; color:#475569;">${celdaDato(c.tipoEquipo, c.historico)}</td>
            <td style="padding:7px 4px; color:#475569;">${celdaDato(c.subEquipo || c.sistema, c.historico)}</td>
            <td style="padding:7px 4px; color:#475569;">${formatoFechaLarga(c.fecha)}</td>
            <td style="padding:7px 4px; white-space:nowrap;">${c.url ? `<a href="${escapeHTML(c.url)}" target="_blank" rel="noopener" style="color:#0284c7; font-weight:700; text-decoration:none;">👁️ Ver</a>` : '—'}${` <a onclick='editarCert(${JSON.stringify(c.numero)})' style="color:#b45309; font-weight:700; cursor:pointer; margin-left:6px;">✏️</a>`}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

    // Guardar resumen para el PDF descargable
    window._dashData = {
      total: base.length,
      totalVisitas,
      esteMes,
      numClientes,
      promedioMensual,
      filtro: filtro.trim(),
      clientes: clientesOrden.map(([nombre, info]) => {
        const fechas = info.fechas.slice().sort();
        return {
          nombre,
          visitas: info.visitasSet.size,
          informes: info.servicios,
          primera: fechas.length ? fechas[0] : '',
          ultima: fechas.length ? fechas[fechas.length - 1] : ''
        };
      }),
      recientes: recientes.map(c => ({ numero: c.numero, cliente: c.cliente, fecha: c.fecha, visita: c.visita })),
      meses: meses.map(m => ({ label: m.label, anio: m.anio, n: m.n }))
    };

    content.innerHTML = html;
  } catch (e) {
    console.error(e);
    content.innerHTML = '<div style="text-align:center; color:#dc2626; padding:24px 0;">No se pudo cargar el tablero.</div>';
  }
}

// Escapa texto para insertarlo seguro en HTML
function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Fecha legible: "12 jun 2026"
function formatoFechaLarga(f) {
  if (!f) return '—';
  const d = new Date(f + (f.length === 10 ? 'T12:00:00' : ''));
  if (isNaN(d)) return f;
  return d.toLocaleDateString('es-CR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '');
}

// Gráfico de barras: servicios por mes (últimos 12 meses), en SVG
function seccionTendencia(meses) {
  const max = Math.max(1, ...meses.map(m => m.n));
  const W = 760, H = 200, padL = 30, padB = 34, padT = 12, padR = 10;
  const gw = W - padL - padR, gh = H - padT - padB;
  const bw = gw / meses.length;
  let barras = '', etiquetas = '', valores = '';
  meses.forEach((m, i) => {
    const x = padL + i * bw;
    const bh = Math.round((m.n / max) * gh);
    const y = padT + gh - bh;
    const cx = x + bw / 2;
    barras += `<rect x="${x + bw * 0.18}" y="${y}" width="${bw * 0.64}" height="${bh}" rx="3" fill="url(#gradBar)"></rect>`;
    if (m.n > 0) valores += `<text x="${cx}" y="${y - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">${m.n}</text>`;
    etiquetas += `<text x="${cx}" y="${H - 14}" text-anchor="middle" font-size="10" fill="#64748b">${m.label}</text>`;
    if (i === 0 || i === meses.length - 1 || m.label.toLowerCase() === 'ene')
      etiquetas += `<text x="${cx}" y="${H - 3}" text-anchor="middle" font-size="8" fill="#94a3b8">${m.anio}</text>`;
  });
  // líneas guía horizontales
  let guias = '';
  for (let g = 0; g <= 2; g++) {
    const val = Math.round((max / 2) * g);
    const y = padT + gh - (gh * g / 2);
    guias += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"></line>`;
    guias += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="#94a3b8">${val}</text>`;
  }
  return `<div style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:18px;">
    <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">📈 Tendencia de servicios (12 meses)</div>
    <div style="font-size:0.72rem; color:#94a3b8; margin-bottom:8px;">Útil para anticipar la estacionalidad de mantenimientos HVAC.</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="gradBar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0ea5e9"></stop><stop offset="100%" stop-color="#0c4a6e"></stop>
      </linearGradient></defs>
      ${guias}${barras}${valores}${etiquetas}
    </svg>
  </div>`;
}

// Gráfico de barras horizontales: top clientes por cantidad de servicios
// ===== Desglose por tipo de equipo y por sistema =====
// Responde de un vistazo: ¿qué se le da mantenimiento y en qué proporción?
// Muestra el valor, o una marca clara cuando el certificado es histórico
// (importado del sistema viejo: su detalle está solo dentro del PDF).
function celdaDato(valor, esHistorico) {
  if (valor) return escapeHTML(valor);
  return esHistorico
    ? '<span style="font-size:0.68rem; color:#94a3b8; font-style:italic;">histórico</span>'
    : '—';
}

function seccionEquipos(base) {
  const contar = campo => {
    const m = new Map();
    base.forEach(c => {
      const v = (campo === 'tipo') ? c.tipoEquipo : (c.subEquipo || c.sistema);
      if (v) m.set(v, (m.get(v) || 0) + 1);
    });
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const barras = (lista, grad) => {
    if (!lista.length) return '<div style="font-size:0.78rem; color:#94a3b8;">Sin datos registrados</div>';
    const max = Math.max(1, ...lista.map(x => x[1]));
    return lista.slice(0, 8).map(([nombre, n]) => `
      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:3px;">
          <span style="color:#1e293b; font-weight:600; max-width:75%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(nombre)}</span>
          <span style="font-weight:800; color:#0c4a6e;">${n}</span>
        </div>
        <div style="background:#eef2f6; border-radius:6px; height:11px; overflow:hidden;">
          <div style="background:${grad}; height:100%; width:${Math.round((n / max) * 100)}%; border-radius:6px;"></div>
        </div>
      </div>`).join('');
  };
  const tipos = contar('tipo'), sistemas = contar('sistema');
  if (!tipos.length && !sistemas.length) return '';
  return `<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;">
    <div style="flex:1; min-width:260px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px;">
      <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">⚙️ Tipo de equipo${tipos.length > 8 ? ' (top 8)' : ''}</div>
      ${barras(tipos, 'linear-gradient(90deg,#38bdf8,#0369a1)')}
    </div>
    <div style="flex:1; min-width:260px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px;">
      <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">🔧 Sistema / componente${sistemas.length > 8 ? ' (top 8)' : ''}</div>
      ${barras(sistemas, 'linear-gradient(90deg,#5eead4,#0f766e)')}
    </div>
  </div>`;
}

function seccionClientes(clientesOrden) {
  if (!clientesOrden.length) return '';
  const top = clientesOrden.slice(0, 10);
  const max = Math.max(1, ...top.map(c => c[1].servicios));
  let filas = '';
  top.forEach(([nombre, info]) => {
    const pct = Math.round((info.servicios / max) * 100);
    filas += `<div style="margin-bottom:9px;">
      <div style="display:flex; justify-content:space-between; font-size:0.82rem; margin-bottom:3px;">
        <span style="color:#1e293b; font-weight:600; max-width:75%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(nombre)}</span>
        <span style="font-weight:800; color:#0c4a6e;">${info.servicios}</span>
      </div>
      <div style="background:#eef2f6; border-radius:6px; height:12px; overflow:hidden;">
        <div style="background:linear-gradient(90deg,#0ea5e9,#0c4a6e); height:100%; width:${pct}%; border-radius:6px;"></div>
      </div>
    </div>`;
  });
  return `<div style="background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:18px;">
    <div style="font-size:0.8rem; font-weight:800; color:#0c4a6e; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">🏢 Clientes por cantidad de servicios${clientesOrden.length > 10 ? ' (top 10)' : ''}</div>
    ${filas}
  </div>`;
}

// ===== Descargar el tablero como PDF ejecutivo =====
function descargarDashboardPDF() {
  const d = window._dashData;
  if (!d) { toast('Abre el tablero primero.'); return; }
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = margin;

    // Encabezado
    doc.setFillColor(12, 74, 110);
    doc.rect(0, 0, W, 70, 'F');
    try {
      const props = doc.getImageProperties(LOGOS.grupo);
      const aspect = props.width / props.height;
      const logoH = 40, logoW = logoH * aspect;
      doc.addImage(LOGOS.grupo, 'PNG', W - margin - logoW, 15, logoW, logoH);
    } catch (e) {}
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Tablero de Operaciones de Mantenimiento', margin, 32);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text('Grupo Empresarial MARC · MARCAire', margin, 48);
    const hoy = new Date().toLocaleDateString('es-CR', { day: '2-digit', month: 'long', year: 'numeric' });
    doc.text('Generado el ' + hoy + (d.filtro ? ('  ·  Filtro: ' + d.filtro) : ''), margin, 61);
    y = 92;

    // KPIs
    const kpis = [
      [String(d.total), 'Informes totales'],
      [String(d.totalVisitas), 'Visitas realizadas'],
      [String(d.esteMes), 'Este mes'],
      [String(d.numClientes), 'Clientes'],
      [d.promedioMensual.toFixed(1), 'Prom. mensual']
    ];
    const kpiW = (W - margin * 2 - 8 * 4) / 5;
    kpis.forEach((k, i) => {
      const x = margin + i * (kpiW + 8);
      doc.setFillColor(240, 247, 251); doc.setDrawColor(226, 232, 240);
      doc.roundedRect(x, y, kpiW, 50, 5, 5, 'FD');
      doc.setTextColor(12, 74, 110); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
      doc.text(k[0], x + kpiW / 2, y + 22, { align: 'center' });
      doc.setTextColor(100, 116, 139); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      doc.text(k[1].toUpperCase(), x + kpiW / 2, y + 38, { align: 'center' });
    });
    y += 70;

    // Tabla por cliente
    doc.setTextColor(12, 74, 110); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('Resumen por cliente', margin, y); y += 14;

    const fmtF = f => { if (!f) return '—'; const dd = new Date(f + 'T12:00:00'); return isNaN(dd) ? f : dd.toLocaleDateString('es-CR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', ''); };
    const cols = [
      { t: 'Cliente', x: margin, w: 200 },
      { t: 'Visitas', x: margin + 200, w: 55, c: true },
      { t: 'Informes', x: margin + 255, w: 60, c: true },
      { t: 'Primer serv.', x: margin + 315, w: 100 },
      { t: 'Último serv.', x: margin + 415, w: 100 }
    ];
    const drawHead = () => {
      doc.setFillColor(12, 74, 110); doc.rect(margin, y, W - margin * 2, 18, 'F');
      doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
      cols.forEach(c => doc.text(c.t, c.c ? c.x + c.w / 2 : c.x + 4, y + 12, c.c ? { align: 'center' } : {}));
      y += 18;
    };
    drawHead();
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    d.clientes.forEach((cl, i) => {
      if (y > H - 60) { doc.addPage(); y = margin; drawHead(); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); }
      if (i % 2) { doc.setFillColor(248, 250, 252); doc.rect(margin, y, W - margin * 2, 16, 'F'); }
      doc.setTextColor(30, 41, 59);
      const nombre = cl.nombre.length > 40 ? cl.nombre.substring(0, 38) + '…' : cl.nombre;
      doc.text(nombre, cols[0].x + 4, y + 11);
      doc.setTextColor(14, 116, 144); doc.setFont('helvetica', 'bold');
      doc.text(String(cl.visitas), cols[1].x + cols[1].w / 2, y + 11, { align: 'center' });
      doc.setTextColor(12, 74, 110);
      doc.text(String(cl.informes), cols[2].x + cols[2].w / 2, y + 11, { align: 'center' });
      doc.setFont('helvetica', 'normal'); doc.setTextColor(71, 85, 105);
      doc.text(fmtF(cl.primera), cols[3].x + 4, y + 11);
      doc.text(fmtF(cl.ultima), cols[4].x + 4, y + 11);
      y += 16;
    });

    // Pie
    const fnombre = 'Tablero_MARCAire_' + new Date().toISOString().slice(0, 10) + '.pdf';
    descargarPDF(doc, fnombre);
    toast('✓ Tablero descargado');
  } catch (e) {
    console.error(e);
    toast('No se pudo generar el PDF del tablero.');
  }
}

async function showHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '<div class="text-center text-slate-500 py-4">Cargando...</div>';
  document.getElementById('historyModal').classList.add('show');

  try {
    const result = await window.storage.list('cert:');
    if (!result || !result.keys || result.keys.length === 0) {
      list.innerHTML = '<div class="text-center text-slate-500 py-6">No hay certificados guardados</div>';
      return;
    }
    // Cargar todos en paralelo
    const items = await Promise.all(result.keys.map(async k => {
      try {
        const r = await window.storage.get(k);
        return r ? JSON.parse(r.value) : null;
      } catch { return null; }
    }));
    let valid = items.filter(Boolean).sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));

    // Permisos: el contratista solo ve los certificados que él creó.
    if (currentUser && currentUser.role === 'contratista') {
      valid = valid.filter(c => c.autor === currentUser.name);
    }

    // Saber qué certificados quedaron pendientes de subir a Drive
    let pendKeys = [];
    try {
      const pr = await window.storage.list('pending:');
      pendKeys = (pr && pr.keys) ? pr.keys.map(k => k.replace('pending:', '')) : [];
    } catch {}

    list.innerHTML = valid.map(c => {
      const tieneCotizacion = c.cotizacionAdicional && c.cotizacionAdicional.trim();
      const estaPendiente = pendKeys.includes(c.numero);
      const linkPdf = c.driveUrl ? (String(c.driveUrl).indexOf('http') === 0 ? c.driveUrl : driveUrl + c.driveUrl) : '';
      const badges = [
        linkPdf ? '<a href="' + linkPdf + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:0.7rem; background:#eff6ff; color:#1d4ed8; border:1px solid #93c5fd; padding:1px 6px; border-radius:10px; font-weight:600; text-decoration:none;">📄 Ver PDF</a>' : '',
        tieneCotizacion ? '<span title="Requiere cotización adicional" style="font-size:0.7rem; background:#fff7ed; color:#c2410c; border:1px solid #fdba74; padding:1px 6px; border-radius:10px; font-weight:600;">💰 Cotizar</span>' : '',
        estaPendiente ? '<span title="Pendiente de enviar a la nube" style="font-size:0.7rem; background:#fef2f2; color:#b91c1c; border:1px solid #fca5a5; padding:1px 6px; border-radius:10px; font-weight:600;">☁️ Sin enviar</span>' : ''
      ].filter(Boolean).join(' ');
      return `

// ============== EDITAR / REABRIR UN CERTIFICADO ==============
// Trae un certificado ya cerrado (de esta tablet o de la nube), lo carga en el
// formulario CON SU MISMO NÚMERO y activa el modo edición. Al Guardar o Enviar,
// se regraba bajo el mismo consecutivo (el Worker hace UPDATE, no duplica).
let _editando = null;   // número que se está editando, o null

async function editarCert(numero) {
  try {
    let cert = null;
    // 1) Primero en esta tablet (trae fotos y firmas completas si están)
    try {
      const r = await window.storage.get('cert:' + numero);
      if (r && r.value) cert = JSON.parse(r.value);
    } catch (e) {}
    // 2) Si no está local, pedirlo a la nube por cliente
    if (!cert && typeof driveUrl === 'string' && driveUrl) {
      toast('Trayendo el certificado de la nube…');
      try {
        const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
        const res = await fetch(driveUrl + sep + 'action=list&_=' + Date.now(), { method: 'GET', redirect: 'follow' });
        const jd = await res.json();
        const fila = (jd.certs || []).find(c => c.numero === numero);
        // El detalle completo vive en el historial por cliente (payload entero)
        if (fila && fila.cliente) {
          const r2 = await fetch(driveUrl + sep + 'action=cliente&nombre=' + encodeURIComponent(fila.cliente) + '&_=' + Date.now(), { method: 'GET', redirect: 'follow' });
          const jd2 = await r2.json();
          cert = (jd2.historial || []).find(c => c.numero === numero) || null;
        }
      } catch (e) {}
    }
    if (!cert) { toast('No pude encontrar ese certificado para editar.'); return; }

    // Normalizar por si vienen campos faltantes (evita errores al rellenar)
    cert.cliente = cert.cliente || {};
    cert.operacion = cert.operacion || {};
    cert.firmas = cert.firmas || {};
    cert.equipos = cert.equipos || [];
    cert.acDone = cert.acDone || [];
    cert.ventDone = cert.ventDone || [];

    closeModal('previewModal'); closeModal('historyModal'); closeModal('dashboardModal');
    if (typeof irAlaApp === 'function') { try { irAlaApp(); } catch (e) {} }

    // Cargar TODO el certificado en el formulario (conserva su número)
    loadDataIntoForm(cert);

    // Rellenar lo que loadDataIntoForm no toca
    { const f = document.getElementById('fecha'); if (f && cert.fecha) f.value = cert.fecha; }
    { const tm = document.getElementById('tipoMantenimiento'); if (tm) tm.value = cert.tipoMantenimiento || ''; }
    { const el = document.getElementById('nombreCliente'); if (el) el.value = cert.cliente.nombre || ''; }
    { const el = document.getElementById('contactoCliente'); if (el) el.value = cert.cliente.contacto || ''; }
    { const el = document.getElementById('modelo'); if (el) el.value = cert.cliente.modelo || ''; }
    { const el = document.getElementById('serie'); if (el) el.value = cert.cliente.serie || ''; }
    { const el = document.getElementById('ubicacion'); if (el) el.value = cert.cliente.ubicacion || ''; }
    { const el = document.getElementById('visita'); if (el) el.value = cert.cliente.visita || ''; }
    { const el = document.getElementById('revisadoPor'); if (el) el.value = cert.revisadoPor || 'MRC // JHB'; }
    { const el = document.getElementById('proximoMant'); if (el) el.value = cert.proximoMantenimiento || ''; }
    if (typeof setTipoYSubEquipo === 'function') {
      setTipoYSubEquipo((cert.equipos && cert.equipos[0]) || cert.tipoEquipo || '', (cert.cliente && cert.cliente.subTipo) || '');
    }

    // Activar modo edición: mismo número, no reservar uno nuevo
    _editando = cert.numero;
    pendingDirty = true;
    mostrarBannerEdicion(cert.numero);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('✏️ Editando ' + cert.numero + '. Al Guardar o Enviar se actualiza el mismo número.');
  } catch (e) {
    toast('No se pudo abrir el certificado para editar.');
  }
}

    exitInfo.style.display = 'none';
    exitInfo.innerHTML = '';

    hc.style.background = '#f1f5f9';
    hc.style.color = '#94a3b8';

  // Las fotos NO se restauran (no se guardan en localStorage por tamaño)
  photos = [];

  document.getElementById('tempRetorno').value = c.operacion.tempRetorno || '';
  document.getElementById('tempSuministro').value = c.operacion.tempSuministro || '';
  document.querySelectorAll('[data-ac]').forEach(el => {
    el.checked = c.acDone.includes(AC_ITEMS[parseInt(el.dataset.ac)]);
  });
  document.querySelectorAll('[data-vent]').forEach(el => {
    el.checked = c.ventDone.includes(VENT_ITEMS[parseInt(el.dataset.vent)]);
  });
  document.getElementById('observaciones').value = c.observaciones || '';
  document.getElementById('comentarios').value = c.comentarios || '';
  document.getElementById('cotizacionAdicional').value = c.cotizacionAdicional || '';
  document.getElementById('tecnicoEncargado').value = c.firmas.tecnico || '';
  document.getElementById('tecnicoAyudante').value = c.firmas.ayudante || '';
  document.getElementById('nombreClienteFirma').value = c.firmas.cliente || '';

  // Restaurar firmas en canvas
  ['Tecnico', 'Ayudante', 'Cliente'].forEach(name => {

    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

      img.onload = () => {
        const dpr = window.devicePixelRatio || 1;
        ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);

      img.src = url;
      canvas.classList.add('filled');

    } else {
      canvas.classList.remove('filled');
      signatures[id] = false;
    }
  });

  // El certificado cargado conserva SU número: si se vuelve a guardar o
  // enviar, se actualiza bajo el mismo consecutivo (no crea uno nuevo).
  const numStr = c.numero.replace('SGM-', '').replace('SVC-', '');

  if (!isNaN(numInt) && numInt > 0) currentNumber = numInt;

// ============== HISTORIAL DEL CLIENTE / AUTO-LLENADO ==============
// Para mantenimientos recurrentes: trae los datos de visitas anteriores del
// mismo cliente para no volver a teclear cliente y equipos. Combina lo que hay
// en este dispositivo (local) con lo guardado en Drive (otros técnicos).
let _histClienteItems = [];

async function buscarHistorialCliente() {
  const nombre = normalizarNombre(document.getElementById('nombreCliente').value);   // v142
  { const el = document.getElementById('nombreCliente'); if (el) el.value = nombre; }
  const box = document.getElementById('histClienteBox');
  if (!nombre) { toast('Escribe primero el nombre del cliente.'); return; }
  box.style.display = 'block';
  box.innerHTML = '<div style="text-align:center; color:#64748b; padding:10px;">🔄 Buscando historial...</div>';

  const porNumero = {};
  const nombreLower = nombre;   // ya viene normalizado (v142)
  const coincide = (a) => {
    a = normalizarNombre(a);
    if (!a) return false;
    return a === nombreLower || a.indexOf(nombreLower) >= 0 || nombreLower.indexOf(a) >= 0;
  };

  // 1) Historial local (este dispositivo) — tiene datos completos
  try {
    const result = await window.storage.list('cert:');
    const keys = (result && result.keys) ? result.keys : [];
    for (const k of keys) {
      try {
        const c = JSON.parse((await window.storage.get(k)).value);
        if (!c || !c.cliente) continue;
        if (!coincide(c.cliente.nombre)) continue;
        if (!c.operacion && !(c.equipos && c.equipos.length)) continue; // solo con datos
        if (c.numero) porNumero[c.numero] = c;
      } catch (e) {}
    }
  } catch (e) {}

  // 2) Historial en Drive con datos completos (__datos.json) — Apps Script v15
  let driveRespondioHistorial = false;
  if (driveUrl) {
    try {
      const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      const res = await fetch(driveUrl + sep + 'action=cliente&nombre=' + encodeURIComponent(nombre),
        { method: 'GET', redirect: 'follow', signal: controller.signal });
      clearTimeout(timer);
      const data = await res.json();
      if (data && Array.isArray(data.historial)) {
        driveRespondioHistorial = true;
        data.historial.forEach(c => {
          if (c && c.numero && !porNumero[c.numero]) porNumero[c.numero] = c;
        });
      }
    } catch (e) {}
  }

  // 3) Visitas que ya están en Drive como PDF (incluye las VIEJAS, sin datos
  //    sueltos). Para esas se carga el nombre y la visita, y se abre el PDF
  //    anterior para copiar los datos del equipo.
  const soloPDF = {};
  if (driveUrl) {
    try {
      const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      const res = await fetch(driveUrl + sep + 'action=list',
        { method: 'GET', redirect: 'follow', signal: controller.signal });
      clearTimeout(timer);
      const data = await res.json();
      if (data && Array.isArray(data.certs)) {
        driveRespondioHistorial = true;
        data.certs.forEach(c => {
          if (!c || !c.numero) return;
          if (!coincide(c.cliente)) return;
          if (porNumero[c.numero]) return; // ya tiene datos completos
          soloPDF[c.numero] = {
            numero: c.numero,
            fecha: c.fecha || '',
            url: c.url || '',
            soloPDF: true,
            cliente: { nombre: c.cliente || nombre, visita: String(c.visita || '').replace(/\D/g, '') }
          };
        });
      }
    } catch (e) {}
  }

  const items = [...Object.values(porNumero), ...Object.values(soloPDF)].sort((a, b) => {
    const fa = a.fecha || '', fb = b.fecha || '';
    if (fb !== fa) return fb.localeCompare(fa);
    return (parseInt(b.cliente && b.cliente.visita) || 0) - (parseInt(a.cliente && a.cliente.visita) || 0);
  });
  _histClienteItems = items;
  renderHistorialCliente(items, driveRespondioHistorial);
}

function renderHistorialCliente(items, driveRespondioHistorial) {
  const box = document.getElementById('histClienteBox');
  if (!items.length) {
    let motivo;
    if (driveRespondioHistorial) {

function usarComoNuevaVisita(idx) {

  cert.operacion = cert.operacion || {};
  cert.firmas = cert.firmas || {};

  cert.acDone = cert.acDone || [];
  cert.ventDone = cert.ventDone || [];

  document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => { if (!el.disabled) el.value = ''; });
  document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
  setVoltaje('');   // las lecturas de voltaje no se arrastran entre visitas

  // Rellenar SOLO lo repetitivo: cliente + equipo + rutina de mantenimiento
  document.getElementById('nombreCliente').value = cert.cliente.nombre || '';

  { const tm=document.getElementById('tipoMantenimiento'); if(tm) tm.value = cert.tipoMantenimiento || ''; }

  document.getElementById('serie').value = cert.cliente.serie || '';
  document.getElementById('ubicacion').value = cert.cliente.ubicacion || '';
  setTipoYSubEquipo((cert.equipos && cert.equipos[0]) || cert.tipoEquipo || '', (cert.cliente && cert.cliente.subTipo) || '');
  document.querySelectorAll('[data-ac]').forEach(el => { el.checked = cert.acDone.includes(AC_ITEMS[parseInt(el.dataset.ac)]); });
  document.querySelectorAll('[data-vent]').forEach(el => { el.checked = cert.ventDone.includes(VENT_ITEMS[parseInt(el.dataset.vent)]); });
  document.getElementById('revisadoPor').value = cert.revisadoPor || 'MRC // JHB';
  if (cert.firmas.tecnico) document.getElementById('tecnicoEncargado').value = cert.firmas.tecnico;
  if (cert.firmas.ayudante) document.getElementById('tecnicoAyudante').value = cert.firmas.ayudante;

  // Próxima visita = la mayor registrada + 1
  let maxVisita = 0;
  _histClienteItems.forEach(c => { const v = parseInt(c.cliente && c.cliente.visita) || 0; if (v > maxVisita) maxVisita = v; });

  const hc = document.getElementById('horaCierre');
  hc.value = ''; hc.setAttribute('readonly', 'readonly'); hc.style.background = '#f1f5f9'; hc.style.color = '#94a3b8';

  // Nuevo cada visita: GPS, fotos y firmas se reinician
  photos = []; renderPhotoGrid();
  gpsCoords = null; gpsCoordsSalida = null;
  document.getElementById('gpsBtnText').textContent = '📍 Marcar ubicación de entrada';
  document.getElementById('gpsBtn').classList.remove('validated', 'processing');
  document.getElementById('gpsExitBtn').classList.remove('validated', 'processing');
  document.getElementById('gpsExitBtnText').textContent = '📍 Marcar ubicación de salida';
  document.getElementById('gpsExitInfo').style.display = 'none';
  document.getElementById('gpsEntradaDisplay').style.display = 'none';
  document.getElementById('gpsSalidaDisplay').style.display = 'none';
  ['sigTecnico', 'sigAyudante', 'sigCliente'].forEach(id => clearSig(id));

  // Número nuevo del consecutivo
  syncCounterFromDrive().then(() => updateCertNumber());
  updateCertNumber();

  pendingDirty = true;

  if (cert.soloPDF) {
    // Visita vieja: solo hay PDF. Abrimos el PDF para copiar datos del equipo.

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteCert(numero) {
  if (!currentUser || currentUser.role !== 'admin') {
    toast('Solo un administrador puede eliminar certificados.');
    return;
  }
  if (!confirm('¿Eliminar el certificado ' + numero + '? Esto no se puede deshacer.')) return;
  try {
    // Respaldo de seguridad antes de borrar: nunca se pierde sin dejar rastro
    const r = await window.storage.get('cert:' + numero);
    if (r && r.value) await window.storage.set('trash:' + numero, r.value);
    await window.storage.delete('cert:' + numero);
    toast('Certificado eliminado (respaldo guardado)');
    closeModal('previewModal');
  } catch (e) {
    toast('Error al eliminar');
  }
}

// Trae desde Drive (Apps Script) la lista de TODOS los servicios hechos por
// todos los técnicos, y los agrega al almacenamiento local para que el
// Dashboard del administrador los pueda ver. Requiere el Apps Script v8.
async function sincronizarDesdeDrive(silencioso) {
  if (!driveUrl) { if (!silencioso) toast('No hay conexión con el servidor.'); return { ok: false }; }
  if (!silencioso) toast('🔄 Trayendo servicios...');
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const sep = driveUrl.indexOf('?') >= 0 ? '&' : '?';
    const res = await fetch(driveUrl + sep + 'action=list', { method: 'GET', redirect: 'follow', signal: controller.signal });
    clearTimeout(timer);
    const data = await res.json();
    if (!data || !Array.isArray(data.certs)) {
      if (!silencioso) toast('El servidor no entregó la lista. Intenta de nuevo en unos minutos.');
      return { ok: false, necesitaActualizar: true };
    }

    // Limpieza: borramos lo que se había traído antes de Drive (para no dejar
    // datos viejos mal clasificados), conservando lo creado localmente.
    try {
      const todas = await window.storage.list('cert:');
      const keysExist = (todas && todas.keys) ? todas.keys : [];
      for (const k of keysExist) {
        try {
          const v = await window.storage.get(k);
          if (v && v.value) {
            const prev = JSON.parse(v.value);
            if (prev && prev.fromDrive) await window.storage.delete(k);
          }
        } catch (e) {}
      }
    } catch (e) {}

    let nuevos = 0;
    for (const r of data.certs) {
      if (!r) continue;
      const num = (r.numero || '').trim();
      // Cada informe (PDF) es un servicio. Si el nombre trae un número tipo
      // SGM-xxx lo usamos como clave (así no se duplica con los locales);
      // si no, usamos el ID único del archivo en Drive para contar cada uno.
      const esSGM = /^SGM/i.test(num);
      const id = r.id || ('x' + Math.random().toString(36).slice(2));
      const key = 'cert:' + (esSGM && num ? num : ('drive_' + id));

      const existe = await window.storage.get(key).catch(() => null);
      if (existe && existe.value) {
        let prev = null;
        try { prev = JSON.parse(existe.value); } catch (e) {}
        if (prev && !prev.fromDrive) continue; // local: no pisar
      }
      const cert = {
        numero: num || ((r.archivo || '').replace(/\.pdf$/i, '')) || '—',
        fecha: r.fecha || '',
        cliente: { nombre: r.cliente || 'Sin cliente', visita: String(r.visita || '').replace(/\D/g, '') },
        equipos: r.equipos ? String(r.equipos).split(',').map(s => s.trim()).filter(Boolean) : [],
        acDone: [], ventDone: [],
        autor: r.autor || '', autorRol: r.autorRol || '',
        savedAt: r.timestamp || r.fecha || '',
        driveId: r.id || '',
        driveUrl: r.url || (r.id ? ('https://drive.google.com/file/d/' + r.id + '/view') : ''),
        fromDrive: true
      };
      await window.storage.set(key, JSON.stringify(cert));
      nuevos++;
    }
    if (!silencioso) toast('✓ ' + nuevos + ' servicio(s) traídos de la nube');
    // Si el dashboard está abierto, refrescarlo
    if (document.getElementById('dashboardModal').classList.contains('show')) {
      renderDashboard();
    }
    return { ok: true, nuevos };
  } catch (e) {
    console.error('Sync Drive error:', e);
    if (!silencioso) toast('No se pudo traer de la nube (' + (e.message || e) + ').');
    return { ok: false, error: e };
  }
}

// Guarda solo los PINes de administrador editados en el panel
async function saveAdminPins() {
  // Calcular los PINes nuevos (o conservar el actual si está vacío/corto)
  const nuevos = usersDB.admins.map((u, i) => {
    const inp = document.getElementById('adminPin' + i);
    return (inp && inp.value.trim().length >= 3) ? inp.value.trim() : u.pin;
  });
  // Validar choques: ni entre admins, ni contra usuarios de campo
  for (let i = 0; i < nuevos.length; i++) {
    if (!/^\d{3,8}$/.test(nuevos[i])) { toast('El PIN de ' + usersDB.admins[i].name + ' debe ser de 3 a 8 dígitos.'); return; }
    const dupAdmin = nuevos.findIndex((p, j) => j !== i && p === nuevos[i]);
    const choqueCampo = pinEnUso(nuevos[i], 'admins');   // ignora a los admins, compara con roles de campo
    if (dupAdmin !== -1 || choqueCampo) {
      const quien = choqueCampo ? (choqueCampo.name + ' (' + roleLabel(choqueCampo.role) + ')') : 'otro administrador';
      toast('⚠ El PIN de ' + usersDB.admins[i].name + ' choca con ' + quien + '. Corrige antes de guardar.');
      return;
    }
  }
  usersDB.admins.forEach((u, i) => { u.pin = nuevos[i]; });
  await saveUsers();
  renderUserManagement();
  toast('✓ PINes de administrador guardados');
}

        </div>
      </div>
    </div>`;
  }).join('');
